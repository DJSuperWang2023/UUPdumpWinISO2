name: Update Windows 11 Dev 26340 amd64 UUP Package

on:
  schedule:
    # 每天 UTC 00:00
    # 北京/新加坡时间 UTC+8 = 每天 08:00
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write


env:

  # ============================================================
  # 仓库中的 UUP 下载脚本目录
  # ============================================================

  FILE_NAME: Windows11_Insider_Preview_Feature_Update_Dev_amd64


  # ============================================================
  # 第二个 ISO Workflow
  # ============================================================

  WORKFLOW_FILE: .github/workflows/Windows11_Insider_Preview_Feature_Update_Dev_amd64.yml


  # ============================================================
  # ★★★ 目标 Build ★★★
  #
  # 只允许：
  #
  # 26340.xxxx
  #
  # 绝对不会选择：
  #
  # 26350.xxxx
  # 26400.xxxx
  # 29648.xxxx
  # ============================================================

  TARGET_BUILD_MAJOR: '26340'


  # ============================================================
  # 当前仓库中的起始 Build
  #
  # 第一次运行时：
  #
  # 26340.9233
  #
  # 只有发现：
  #
  # 26340.xxxx > 26340.9233
  #
  # 才进行更新。
  # ============================================================

  MIN_BUILD: '26340.9233'


  # ============================================================
  # UUP dump
  # ============================================================

  UUP_API: https://api.uupdump.net

  UUP_SITE: https://uupdump.net


  # ============================================================
  # ★ 固定语言
  #
  # 只下载简体中文
  # ============================================================

  LANGUAGE: zh-cn


  # ============================================================
  # ★ 基础 SKU
  #
  # 选择 Professional
  # ============================================================

  EDITION: Professional


jobs:

  update:

    runs-on: ubuntu-latest


    steps:


      # ========================================================
      # 1. Checkout 仓库
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # 2. 安装工具
      # ========================================================

      - name: Install required tools
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y jq unzip


      # ========================================================
      # 3. 读取当前 Workflow 的 Build_VERSION
      # ========================================================

      - name: Read current Build
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "读取当前 Build"

          echo "=========================================="


          CURRENT_BUILD=$(
            grep -oP \
              "Build_VERSION:\s*['\"]\K[0-9]+\.[0-9]+" \
              "${WORKFLOW_FILE}" \
              | head -n 1
          )


          if [ -z "$CURRENT_BUILD" ]; then

            echo "ERROR: 找不到 Build_VERSION"

            exit 1

          fi


          echo "当前仓库 Build: $CURRENT_BUILD"


          echo "CURRENT_BUILD=$CURRENT_BUILD" >> "$GITHUB_ENV"


      # ========================================================
      # 4. 查询 UUP dump
      #
      # ★★★ 关键修正 ★★★
      #
      # 以前：
      #
      # fetchupd.php?arch=amd64&ring=Dev&flight=Mainline
      #
      # 会返回当前 Dev 的其他主 Build，
      # 例如 29648.xxxx。
      #
      # 现在：
      #
      # 明确指定：
      #
      # build=26340
      #
      # 所以只寻找 26340 分支。
      # ========================================================

      - name: Query UUP dump for Build 26340
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "查询 UUP dump"

          echo "=========================================="


          API_URL="${UUP_API}/fetchupd.php?arch=amd64&ring=Dev&flight=Mainline&build=${TARGET_BUILD_MAJOR}"


          echo ""

          echo "API:"

          echo "$API_URL"


          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 180 \
            -L \
            "$API_URL" \
            -o latest.json


          echo ""

          echo "UUP dump API 返回："

          cat latest.json


          echo ""


          # ====================================================
          # 检查 API error
          # ====================================================

          if jq -e '.response.error' latest.json >/dev/null 2>&1; then

            echo "ERROR: UUP dump API 返回错误："

            jq '.response.error' latest.json

            exit 1

          fi


          # ====================================================
          # 检查 updateArray
          # ====================================================

          UPDATE_COUNT=$(
            jq \
              '.response.updateArray | length' \
              latest.json
          )


          echo "API 返回更新数量: $UPDATE_COUNT"


          if [ "$UPDATE_COUNT" -eq 0 ]; then

            echo "ERROR: API 没有返回任何更新。"

            exit 1

          fi


          # ====================================================
          # 只提取：
          #
          # 26340.xxxx
          #
          # amd64
          #
          # ====================================================

          jq -r --arg major "$TARGET_BUILD_MAJOR" '

            .response.updateArray[]

            |

            select(.arch == "amd64")

            |

            select(
              (.foundBuild | test("^" + $major + "\\.[0-9]+$"))
            )

            |

            [
              .foundBuild,
              .updateId,
              (.updateTitle // "")
            ]

            |

            @tsv

          ' latest.json > builds.tsv


          echo ""

          echo "=========================================="

          echo "26340 候选版本"

          echo "=========================================="


          if [ ! -s builds.tsv ]; then

            echo "ERROR: 没有找到 26340.xxxx"

            exit 1

          fi


          cat builds.tsv


      # ========================================================
      # 5. 选择最新的 26340.xxxx
      #
      # 注意：
      #
      # 这里只比较 26340 后面的 Revision。
      #
      # 绝不会把 29648 当成候选。
      # ========================================================

      - name: Select latest 26340 Build
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "选择最新 26340.xxxx"

          echo "=========================================="


          LATEST_LINE=$(
            sort \
              -t. \
              -k1,1n \
              -k2,2n \
              builds.tsv \
              | tail -n 1
          )


          LATEST_BUILD=$(echo "$LATEST_LINE" | cut -f1)

          UPDATE_ID=$(echo "$LATEST_LINE" | cut -f2)

          UPDATE_TITLE=$(echo "$LATEST_LINE" | cut -f3-)


          echo ""

          echo "最新候选 Build : $LATEST_BUILD"

          echo "Update ID       : $UPDATE_ID"

          echo "Title            : $UPDATE_TITLE"


          # ====================================================
          # 强制验证主 Build
          # ====================================================

          if ! [[ "$LATEST_BUILD" =~ ^26340\.[0-9]+$ ]]; then

            echo "ERROR: 选出的 Build 不是 26340.xxxx"

            echo "$LATEST_BUILD"

            exit 1

          fi


          echo "LATEST_BUILD=$LATEST_BUILD" >> "$GITHUB_ENV"

          echo "UPDATE_ID=$UPDATE_ID" >> "$GITHUB_ENV"

          echo "UPDATE_TITLE=$UPDATE_TITLE" >> "$GITHUB_ENV"


      # ========================================================
      # 6. 比较当前版本
      #
      # 只比较：
      #
      # 26340.9233
      #
      # 与：
      #
      # 26340.xxxx
      # ========================================================

      - name: Compare Build
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "比较 Build"

          echo "=========================================="


          python3 <<'PY'

          import os
          import sys


          current = os.environ["CURRENT_BUILD"]

          latest = os.environ["LATEST_BUILD"]

          minimum = os.environ["MIN_BUILD"]

          target_major = os.environ["TARGET_BUILD_MAJOR"]


          def parse_build(value):

              parts = value.split(".")

              if len(parts) != 2:

                  raise ValueError(
                      f"Invalid Build: {value}"
                  )

              return (
                  int(parts[0]),
                  int(parts[1])
              )


          current_major, current_minor = parse_build(
              current
          )

          latest_major, latest_minor = parse_build(
              latest
          )

          minimum_major, minimum_minor = parse_build(
              minimum
          )


          print(
              f"Current Build : {current}"
          )

          print(
              f"Latest Build  : {latest}"
          )

          print(
              f"Minimum Build : {minimum}"
          )

          print(
              f"Target Major  : {target_major}"
          )


          # ====================================================
          # 必须是 26340
          # ====================================================

          if latest_major != int(target_major):

              print(
                  "ERROR: 最新版本主 Build 不等于目标 Build。"
              )

              sys.exit(1)


          # ====================================================
          # 当前版本也必须是 26340
          # ====================================================

          if current_major != int(target_major):

              print(
                  "ERROR: 仓库当前 Build 不是目标 26340。"
              )

              sys.exit(1)


          # ====================================================
          # 比较完整版本
          # ====================================================

          current_version = (
              current_major,
              current_minor
          )

          latest_version = (
              latest_major,
              latest_minor
          )

          minimum_version = (
              minimum_major,
              minimum_minor
          )


          # ====================================================
          # 最新版本不能低于 MIN_BUILD
          # ====================================================

          if latest_version < minimum_version:

              print(
                  "ERROR: UUP dump 返回版本低于 MIN_BUILD。"
              )

              sys.exit(1)


          # ====================================================
          # 没有更新
          # ====================================================

          if latest_version <= current_version:

              print(
                  "没有发现新的 26340 Build。"
              )

              update = "false"


          else:

              print(
                  "发现新的 26340 Build！"
              )

              update = "true"


          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as f:

              f.write(
                  f"UPDATE_NEEDED={update}\n"
              )

          PY


      # ========================================================
      # 7. 没有更新
      # ========================================================

      - name: No update
        if: env.UPDATE_NEEDED == 'false'
        shell: bash
        run: |

          echo "=========================================="

          echo "没有新的 26340 Build"

          echo "=========================================="

          echo "当前: $CURRENT_BUILD"

          echo "UUP : $LATEST_BUILD"


      # ========================================================
      # 8. 创建临时目录
      # ========================================================

      - name: Prepare temporary directory
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          rm -rf new_package

          rm -rf extracted_package


          mkdir -p new_package

          mkdir -p extracted_package


      # ========================================================
      # 9. 下载 UUP dump Conversion Package
      #
      # ★★★ 重要 ★★★
      #
      # 这不是下载几十 GB UUP。
      #
      # 这里下载的是 UUP dump 生成的脚本包 ZIP。
      #
      # autodl=3：
      #
      # Download + Convert + Virtual Editions
      #
      # updates=1：
      # 包括更新
      #
      # cleanup=1：
      # 运行组件清理
      #
      # netfx=1：
      # 集成 .NET 3.5
      #
      # esd=1：
      # ESD / 固实压缩
      #
      # virtualEditions：
      # 你要求的全部 Virtual Editions
      # ========================================================

      - name: Download UUP conversion package
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "下载 UUP dump 转换脚本包"

          echo "=========================================="


          DOWNLOAD_URL="${UUP_SITE}/get.php?id=${UPDATE_ID}&pack=${LANGUAGE}&edition=${EDITION}&aria2=2&autodl=3"


          echo ""

          echo "Build:"

          echo "$LATEST_BUILD"


          echo ""

          echo "Language:"

          echo "$LANGUAGE"


          echo ""

          echo "Edition:"

          echo "$EDITION"


          echo ""

          echo "Download URL:"

          echo "$DOWNLOAD_URL"


          # ====================================================
          # POST：
          #
          # autodl=3
          # updates=1
          # cleanup=1
          # netfx=1
          # esd=1
          #
          # Virtual Editions
          # ====================================================

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            -L \
            -X POST \
            "$DOWNLOAD_URL" \
            --data-urlencode "updates=1" \
            --data-urlencode "cleanup=1" \
            --data-urlencode "netfx=1" \
            --data-urlencode "esd=1" \
            --data-urlencode "virtualEditions[]=ProfessionalWorkstation" \
            --data-urlencode "virtualEditions[]=ProfessionalEducation" \
            --data-urlencode "virtualEditions[]=Education" \
            --data-urlencode "virtualEditions[]=Enterprise" \
            --data-urlencode "virtualEditions[]=ServerRdsh" \
            --data-urlencode "virtualEditions[]=IoTEnterprise" \
            --data-urlencode "virtualEditions[]=IoTEnterpriseSubscription" \
            -o uup_package.zip


          echo ""

          echo "下载完成："

          ls -lh uup_package.zip


      # ========================================================
      # 10. 验证 ZIP
      # ========================================================

      - name: Verify UUP package
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "验证 UUP 下载包"

          echo "=========================================="


          if [ ! -f uup_package.zip ]; then

            echo "ERROR: uup_package.zip 不存在。"

            exit 1

          fi


          FILE_SIZE=$(
            stat \
              -c%s \
              uup_package.zip
          )


          echo "ZIP 大小: $FILE_SIZE bytes"


          if [ "$FILE_SIZE" -lt 1000 ]; then

            echo "ERROR: ZIP 文件异常过小。"

            exit 1

          fi


          echo ""

          echo "ZIP 内容："

          unzip -l uup_package.zip


          # ====================================================
          # 必须存在转换脚本
          # ====================================================

          unzip -l uup_package.zip \
            | grep -q \
              "uup_download_windows.cmd"


          # ====================================================
          # 必须存在转换配置
          # ====================================================

          unzip -l uup_package.zip \
            | grep -q \
              "ConvertConfig.ini"


          # ====================================================
          # 必须存在 files
          # ====================================================

          unzip -l uup_package.zip \
            | grep -q \
              "files/"


          echo ""

          echo "UUP 下载包验证成功。"


      # ========================================================
      # 11. 解压
      # ========================================================

      - name: Extract UUP package
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          unzip \
            -q \
            uup_package.zip \
            -d extracted_package


          echo ""

          echo "解压完成："

          find \
            extracted_package \
            -maxdepth 3 \
            -type f \
            | sort


      # ========================================================
      # 12. 找到实际 Package Root
      # ========================================================

      - name: Normalize package structure
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "整理 UUP Package"

          echo "=========================================="


          CMD_FILE=$(
            find \
              extracted_package \
              -type f \
              -name "uup_download_windows.cmd" \
              | head -n 1
          )


          if [ -z "$CMD_FILE" ]; then

            echo "ERROR: 找不到 uup_download_windows.cmd"

            exit 1

          fi


          PACKAGE_ROOT=$(
            dirname "$CMD_FILE"
          )


          echo "Package Root:"

          echo "$PACKAGE_ROOT"


          cp -a \
            "$PACKAGE_ROOT"/. \
            new_package/


      # ========================================================
      # 13. 验证完整 Package
      # ========================================================

      - name: Verify complete package
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "验证完整 Package"

          echo "=========================================="


          test \
            -f \
            new_package/uup_download_windows.cmd


          test \
            -f \
            new_package/ConvertConfig.ini


          test \
            -d \
            new_package/files


          FILE_COUNT=$(
            find \
              new_package \
              -type f \
              | wc -l
          )


          echo "文件总数: $FILE_COUNT"


          if [ "$FILE_COUNT" -lt 5 ]; then

            echo "ERROR: 文件数量异常。"

            exit 1

          fi


          echo ""

          echo "Package 结构正常。"


      # ========================================================
      # 14. 验证 ConvertConfig.ini
      #
      # UUP dump 的 Conversion Package 会把这些选项
      # 写入 ConvertConfig.ini。
      #
      # autodl=3 对应 Virtual Editions。
      # ========================================================

      - name: Verify conversion configuration
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          CONFIG="new_package/ConvertConfig.ini"


          echo "=========================================="

          echo "ConvertConfig.ini"

          echo "=========================================="


          cat "$CONFIG"


          echo ""


          # ====================================================
          # 包括更新
          # ====================================================

          grep -Eq \
            '^AddUpdates[[:space:]]*=[[:space:]]*1' \
            "$CONFIG"


          # ====================================================
          # 组件清理
          # ====================================================

          grep -Eq \
            '^Cleanup[[:space:]]*=[[:space:]]*1' \
            "$CONFIG"


          # ====================================================
          # .NET 3.5
          # ====================================================

          grep -Eq \
            '^NetFx3[[:space:]]*=[[:space:]]*1' \
            "$CONFIG"


          # ====================================================
          # ESD
          # ====================================================

          grep -Eq \
            '^wim2esd[[:space:]]*=[[:space:]]*1' \
            "$CONFIG"


          # ====================================================
          # Virtual Editions
          # ====================================================

          grep -Eq \
            '^StartVirtual[[:space:]]*=[[:space:]]*1' \
            "$CONFIG"


          echo ""

          echo "转换配置验证成功。"


      # ========================================================
      # 15. 验证 Virtual Editions
      # ========================================================

      - name: Verify Virtual Editions
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          CONFIG="new_package/ConvertConfig.ini"


          echo "=========================================="

          echo "验证 Virtual Editions"

          echo "=========================================="


          for EDITION_NAME in \
            ProfessionalWorkstation \
            ProfessionalEducation \
            Education \
            Enterprise \
            ServerRdsh \
            IoTEnterprise \
            IoTEnterpriseSubscription

          do

            echo "检查：$EDITION_NAME"


            grep -q \
              "$EDITION_NAME" \
              "$CONFIG"

          done


          echo ""

          echo "7 个 Virtual Editions 全部存在。"


      # ========================================================
      # 16. 整体替换旧目录
      #
      # ★★★ 非常重要 ★★★
      #
      # 整个目录删除。
      #
      # 包括：
      #
      # files/
      #
      # 旧文件全部删除。
      # ========================================================

      - name: Replace entire UUP directory
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "整体替换 UUP 文件夹"

          echo "=========================================="


          echo ""

          echo "删除旧目录："

          echo "$FILE_NAME"


          rm -rf \
            "$FILE_NAME"


          mkdir -p \
            "$FILE_NAME"


          echo ""

          echo "复制新 Package："


          cp -a \
            new_package/. \
            "$FILE_NAME/"


          echo ""

          echo "新目录内容："

          find \
            "$FILE_NAME" \
            -type f \
            | sort


      # ========================================================
      # 17. 修改 Build_VERSION
      # ========================================================

      - name: Update Build_VERSION
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "修改 Build_VERSION"

          echo "=========================================="


          python3 <<'PY'

          import os
          import re


          path = os.environ["WORKFLOW_FILE"]

          new_build = os.environ["LATEST_BUILD"]


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              text = f.read()


          pattern = (
              r"(Build_VERSION:\s*)"
              r"['\"]"
              r"[0-9]+\.[0-9]+"
              r"['\"]"
          )


          new_text, count = re.subn(
              pattern,
              rf"\g<1>'{new_build}'",
              text,
              count=1
          )


          if count != 1:

              raise SystemExit(
                  "ERROR: Build_VERSION "
                  "没有找到或找到次数不正确。"
              )


          with open(
              path,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write(new_text)


          print(
              f"Build_VERSION 已修改为: {new_build}"
          )

          PY


      # ========================================================
      # 18. 最终安全检查
      # ========================================================

      - name: Final verification
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "最终检查"

          echo "=========================================="


          # ====================================================
          # 检查 Build 必须仍然是 26340.xxxx
          # ====================================================

          if ! [[ "$LATEST_BUILD" =~ ^26340\.[0-9]+$ ]]; then

            echo "ERROR: Build 不符合 26340.xxxx"

            exit 1

          fi


          # ====================================================
          # 检查目录
          # ====================================================

          test \
            -f \
            "$FILE_NAME/uup_download_windows.cmd"


          test \
            -f \
            "$FILE_NAME/ConvertConfig.ini"


          test \
            -d \
            "$FILE_NAME/files"


          # ====================================================
          # 检查 Workflow Build
          # ====================================================

          echo ""

          grep \
            "Build_VERSION:" \
            "$WORKFLOW_FILE"


          # ====================================================
          # 确认没有错误的 29648
          # ====================================================

          if grep -q \
            "29648" \
            "$WORKFLOW_FILE"; then

            echo "ERROR: Workflow 中发现 29648"

            exit 1

          fi


          echo ""

          echo "最终检查成功。"


      # ========================================================
      # 19. Git Commit
      # ========================================================

      - name: Commit changes
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            "$FILE_NAME"


          git add \
            "$WORKFLOW_FILE"


          if git diff --cached --quiet; then

            echo "没有需要提交的修改。"

            exit 0

          fi


          git commit \
            -m \
            "Update Windows 11 Dev 26340 to $LATEST_BUILD"


      # ========================================================
      # 20. Push
      # ========================================================

      - name: Push repository update
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |

          set -e


          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"


          echo ""

          echo "仓库更新成功。"


      # ========================================================
      # 21. 启动 ISO Workflow
      #
      # 使用 GH_PAT。
      #
      # 不依赖 GITHUB_TOKEN 的 push 自动触发。
      # ========================================================

      - name: Start ISO build workflow
        if: env.UPDATE_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |

          set -e


          echo "=========================================="

          echo "启动 ISO Workflow"

          echo "=========================================="


          if [ -z "$GH_TOKEN" ]; then

            echo "ERROR: 没有找到 GH_PAT"

            echo ""

            echo "请检查："

            echo "Settings"

