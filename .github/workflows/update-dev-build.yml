name: Auto Update Windows 11 Experimental Dev Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: windows11-dev-build-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  UUP_API: 'https://api.uupdump.net'
  ARCH: 'amd64'
  RING: 'Dev'
  FLIGHT: 'Mainline'
  MIN_BUILD: '26340.9233'
  LANGUAGE: 'zh-cn'
  EDITION: 'professional'
  FILE_NAME: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64'
  ISO_WORKFLOW: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64.yml'

jobs:
  update:
    name: Detect Experimental Build and Update UUP Package
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ============================================================
      # 2. Read current Build
      # ============================================================

      - name: Read current Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $pattern = "Build_VERSION\s*:\s*['""]([^'""]+)['""]"
          $match = [regex]::Match($content, $pattern)

          if (-not $match.Success) {
              throw "Build_VERSION was not found in ISO workflow."
          }

          $currentBuild = $match.Groups[1].Value.Trim()

          if ($currentBuild -notmatch '^\d+\.\d+$') {
              throw "Invalid current Build: $currentBuild"
          }

          Write-Host "Current Build: $currentBuild"

          Add-Content -Path $env:GITHUB_ENV -Value "CURRENT_BUILD=$currentBuild"

      # ============================================================
      # 3. Query UUP API only
      # ============================================================
      # IMPORTANT:
      # - Only query UUP API. No Microsoft release-notes page is used.
      # - Lock ONLY the Windows 11 Experimental / Dev channel.
      # - UUP API ring=Dev is the channel selector; do NOT select by the
      #   highest Build number returned from unrelated channels.
      # - The repository minimum accepted Build is 26340.9233.
      # - Do NOT lock Build, BuildBranch, kernel codename, or any internal
      #   branch name. Those values are allowed to change over time.
      # - The API response's top-level foundBuild/updateId/updateTitle are
      #   authoritative. updateArray contains component/file information and
      #   must NOT be treated as a list of different builds.
      # - This prevents a higher Canary/Future Platforms build from being
      #   selected merely because its number is larger.
      # ============================================================

      - name: Query UUP API for Windows 11 Experimental channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # IMPORTANT:
          # The channel is selected ONLY by the UUP API parameters below.
          # Do not infer the channel from Build, BuildBranch, kernel codename,
          # or from the largest number inside updateArray.
          $query = @(
            "arch=$([uri]::EscapeDataString($env:ARCH))"
            "ring=$([uri]::EscapeDataString('Dev'))"
            "flight=$([uri]::EscapeDataString('Mainline'))"
            "build=$([uri]::EscapeDataString('latest'))"
          ) -join "&"

          $uri = "$env:UUP_API/fetchupd.php?$query"

          Write-Host "=========================================="
          Write-Host "UUP API CHANNEL LOCK"
          Write-Host "=========================================="
          Write-Host "API    : $env:UUP_API"
          Write-Host "Arch   : $env:ARCH"
          Write-Host "Ring   : Dev"
          Write-Host "Flight : Mainline"
          Write-Host "Build  : NOT LOCKED"
          Write-Host "Min    : $env:MIN_BUILD"
          Write-Host "Branch : NOT LOCKED"
          Write-Host "Kernel : NOT LOCKED"
          Write-Host "=========================================="
          Write-Host "Request: $uri"

          $response = Invoke-RestMethod `
            -Uri $uri `
            -Method Get `
            -TimeoutSec 120

          $response |
            ConvertTo-Json -Depth 100 |
            Out-File -FilePath "uup-response.json" -Encoding utf8

          if ($null -eq $response) {
              throw "UUP API returned an empty response."
          }

          # UUP API normally wraps the result in response, but keep the
          # parser tolerant of both wrapped and unwrapped responses.
          $payload = $response
          if ($response.PSObject.Properties.Name -contains "response" -and $null -ne $response.response) {
              $payload = $response.response
          }

          if ($payload.PSObject.Properties.Name -contains "error" -and $null -ne $payload.error) {
              throw "UUP API error: $($payload.error)"
          }

          # ----------------------------------------------------------
          # IMPORTANT FIX:
          # fetchupd.php is queried with ring=Dev + flight=Mainline.
          # The returned updateArray is NOT a list of Builds to sort.
          # Depending on the API revision it may be a single object or an
          # array of component/update records. We therefore read the Build
          # and Update ID from the response first, and only use updateArray
          # as a fallback for locating the same update.
          # ----------------------------------------------------------

          function Get-FirstPropertyValue {
              param(
                  [Parameter(Mandatory=$true)] $Object,
                  [Parameter(Mandatory=$true)] [string[]] $Names
              )

              foreach ($name in $Names) {
                  if ($null -ne $Object -and $Object.PSObject.Properties.Name -contains $name) {
                      $value = $Object.$name
                      if ($null -ne $value -and -not [string]::IsNullOrWhiteSpace([string]$value)) {
                          return [string]$value
                      }
                  }
              }

              return $null
          }

          $targetBuild = Get-FirstPropertyValue -Object $payload -Names @(
            "foundBuild", "build", "updateBuild"
          )

          $updateId = Get-FirstPropertyValue -Object $payload -Names @(
            "updateId", "uuid", "id"
          )

          $updateTitle = Get-FirstPropertyValue -Object $payload -Names @(
            "updateTitle", "title", "name"
          )

          # Normalize updateArray/updates/updateInfo into an array only for
          # fallback extraction. Never sort this collection by Build.
          $records = @()

          foreach ($propertyName in @("updateArray", "updates", "updateInfo")) {
              if ($payload.PSObject.Properties.Name -contains $propertyName -and $null -ne $payload.$propertyName) {
                  $records = @($payload.$propertyName)
                  break
              }
          }

          # Some API revisions return the useful fields inside the first
          # record. Use them only if the response-level fields are absent.
          if ([string]::IsNullOrWhiteSpace($targetBuild) -or [string]::IsNullOrWhiteSpace($updateId)) {
              foreach ($record in $records) {
                  if ([string]::IsNullOrWhiteSpace($targetBuild)) {
                      $targetBuild = Get-FirstPropertyValue -Object $record -Names @(
                        "foundBuild", "build", "updateBuild"
                      )
                  }

                  if ([string]::IsNullOrWhiteSpace($updateId)) {
                      $updateId = Get-FirstPropertyValue -Object $record -Names @(
                        "updateId", "uuid", "id"
                      )
                  }

                  if ([string]::IsNullOrWhiteSpace($updateTitle)) {
                      $updateTitle = Get-FirstPropertyValue -Object $record -Names @(
                        "updateTitle", "title", "name"
                      )
                  }

                  if (-not [string]::IsNullOrWhiteSpace($targetBuild) -and
                      -not [string]::IsNullOrWhiteSpace($updateId)) {
                      break
                  }
              }
          }

          if ([string]::IsNullOrWhiteSpace($targetBuild)) {
              throw "UUP API did not return a Build for ring=Dev / flight=Mainline. See uup-response.json for the raw API response."
          }

          if ($targetBuild -notmatch '^\d+\.\d+$') {
              throw "UUP API returned an invalid Build: $targetBuild"
          }

          $minimumBuild = [version]$env:MIN_BUILD
          $apiBuild = [version]$targetBuild

          if ($apiBuild -lt $minimumBuild) {
              throw "UUP API returned Build $targetBuild, below repository minimum $env:MIN_BUILD. Refusing to update."
          }

          if ([string]::IsNullOrWhiteSpace($updateId)) {
              throw "UUP API did not return an Update ID for the Dev/Experimental update. See uup-response.json."
          }

          # Accept the normal UUID and the optional _rev.N suffix used by
          # UUP identifiers. Do not derive the ID from Build or branch names.
          if ($updateId -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:_rev\.\d+)?$') {
              throw "UUP API returned an invalid Update ID: $updateId"
          }

          if ([string]::IsNullOrWhiteSpace($updateTitle)) {
              $updateTitle = "Windows 11 Insider Preview $targetBuild"
          }

          # Optional metadata validation. If the API exposes a channel/ring
          # field, reject an explicit non-Dev/Experimental result. If the
          # field is absent, do NOT fail: ring=Dev in the API request is the
          # actual channel selector and some API responses omit this field.
          $metadataValues = @()
          foreach ($object in @($payload) + $records) {
              foreach ($propertyName in @("ring", "channel", "flight")) {
                  if ($object.PSObject.Properties.Name -contains $propertyName) {
                      $value = [string]$object.$propertyName
                      if (-not [string]::IsNullOrWhiteSpace($value)) {
                          $metadataValues += $value
                      }
                  }
              }
          }

          $metadataValues = @($metadataValues | Select-Object -Unique)

          foreach ($value in $metadataValues) {
              $upper = $value.ToUpperInvariant()
              if ($upper -match 'CANARY|BETA|RELEASE\s*PREVIEW|RP|FUTURE') {
                  throw "UUP API metadata explicitly indicates a non-Dev channel ($value). Refusing to update."
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "SELECTED UPDATE"
          Write-Host "=========================================="
          Write-Host "Channel : Windows 11 Experimental"
          Write-Host "Ring    : Dev"
          Write-Host "Flight  : Mainline"
          Write-Host "Build   : $targetBuild"
          Write-Host "Minimum : $env:MIN_BUILD"
          Write-Host "Title   : $updateTitle"
          Write-Host "UpdateID: $updateId"
          Write-Host "Branch  : NOT LOCKED"
          Write-Host "Kernel  : NOT LOCKED"
          Write-Host "=========================================="

          Add-Content -Path $env:GITHUB_ENV -Value "TARGET_BUILD=$targetBuild"
          Add-Content -Path $env:GITHUB_ENV -Value "UUP_UPDATE_ID=$updateId"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_TITLE=$updateTitle"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_CHANNEL=Windows 11 Experimental"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_RING=Dev"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_FLIGHT=Mainline"

      # ============================================================
      # 4. Compare Build
      # ============================================================

      - name: Compare Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $current = [version]$env:CURRENT_BUILD
          $target = [version]$env:TARGET_BUILD
          $minimum = [version]$env:MIN_BUILD

          Write-Host "Current Build: $current"
          Write-Host "Target Build : $target"
          Write-Host "Minimum Build: $minimum"

          if ($target -lt $minimum) {
              throw "Target Build $target is below the repository minimum $minimum."
          }

          if ($target -le $current) {
              Write-Host "No update required."
              Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_AVAILABLE=false"
              exit 0
          }

          Write-Host "New Build detected."
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_AVAILABLE=true"

      # ============================================================
      # 5. Verify exact Build with UUP API
      # ============================================================

      - name: Verify exact Build with UUP API
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = $env:TARGET_BUILD
          $query = @(
            "arch=$([uri]::EscapeDataString($env:ARCH))"
            "ring=$([uri]::EscapeDataString('Dev'))"
            "flight=$([uri]::EscapeDataString('Mainline'))"
            "build=$([uri]::EscapeDataString($build))"
          ) -join "&"

          $uri = "$env:UUP_API/fetchupd.php?$query"

          Write-Host "Verifying exact Dev/Experimental Build through UUP API: $build"

          $response = Invoke-RestMethod `
            -Uri $uri `
            -Method Get `
            -TimeoutSec 120

          $response |
            ConvertTo-Json -Depth 100 |
            Out-File -FilePath "uup-response-verify.json" -Encoding utf8

          if ($null -eq $response) {
              throw "UUP API verification returned an empty response."
          }

          $payload = $response
          if ($response.PSObject.Properties.Name -contains "response" -and $null -ne $response.response) {
              $payload = $response.response
          }

          if ($payload.PSObject.Properties.Name -contains "error" -and $null -ne $payload.error) {
              throw "UUP API verification error: $($payload.error)"
          }

          function Get-FirstPropertyValue {
              param(
                  [Parameter(Mandatory=$true)] $Object,
                  [Parameter(Mandatory=$true)] [string[]] $Names
              )

              foreach ($name in $Names) {
                  if ($null -ne $Object -and $Object.PSObject.Properties.Name -contains $name) {
                      $value = $Object.$name
                      if ($null -ne $value -and -not [string]::IsNullOrWhiteSpace([string]$value)) {
                          return [string]$value
                      }
                  }
              }

              return $null
          }

          $verifiedBuild = Get-FirstPropertyValue -Object $payload -Names @(
            "foundBuild", "build", "updateBuild"
          )

          $verifiedId = Get-FirstPropertyValue -Object $payload -Names @(
            "updateId", "uuid", "id"
          )

          $records = @()
          foreach ($propertyName in @("updateArray", "updates", "updateInfo")) {
              if ($payload.PSObject.Properties.Name -contains $propertyName -and $null -ne $payload.$propertyName) {
                  $records = @($payload.$propertyName)
                  break
              }
          }

          foreach ($record in $records) {
              if ([string]::IsNullOrWhiteSpace($verifiedBuild)) {
                  $verifiedBuild = Get-FirstPropertyValue -Object $record -Names @(
                    "foundBuild", "build", "updateBuild"
                  )
              }
              if ([string]::IsNullOrWhiteSpace($verifiedId)) {
                  $verifiedId = Get-FirstPropertyValue -Object $record -Names @(
                    "updateId", "uuid", "id"
                  )
              }
              if (-not [string]::IsNullOrWhiteSpace($verifiedBuild) -and
                  -not [string]::IsNullOrWhiteSpace($verifiedId)) {
                  break
              }
          }

          if ($verifiedBuild -ne $build) {
              throw "UUP API verification mismatch. Requested: $build ; Returned: $verifiedBuild"
          }

          if ([version]$verifiedBuild -lt [version]$env:MIN_BUILD) {
              throw "UUP API verification returned Build $verifiedBuild below repository minimum $env:MIN_BUILD."
          }

          if ([string]::IsNullOrWhiteSpace($verifiedId)) {
              throw "UUP API verification returned no Update ID."
          }

          if ($verifiedId -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:_rev\.\d+)?$') {
              throw "UUP API verification returned an invalid Update ID: $verifiedId"
          }

          # Only reject an explicitly reported non-Dev channel. Do not
          # require a ring/flight field because some API responses omit it.
          $metadataValues = @()
          foreach ($object in @($payload) + $records) {
              foreach ($propertyName in @("ring", "channel", "flight")) {
                  if ($object.PSObject.Properties.Name -contains $propertyName) {
                      $value = [string]$object.$propertyName
                      if (-not [string]::IsNullOrWhiteSpace($value)) {
                          $metadataValues += $value
                      }
                  }
              }
          }

          foreach ($value in @($metadataValues | Select-Object -Unique)) {
              $upper = $value.ToUpperInvariant()
              if ($upper -match 'CANARY|BETA|RELEASE\s*PREVIEW|RP|FUTURE') {
                  throw "UUP API verification explicitly indicates a non-Dev channel ($value). Refusing to continue."
              }
          }

          Write-Host "Verified Build  : $verifiedBuild"
          Write-Host "Verified UpdateID: $verifiedId"
          Write-Host "Verified Channel : Windows 11 Experimental / Dev"
          Write-Host "Branch           : NOT LOCKED"
          Write-Host "Kernel           : NOT LOCKED"

          Add-Content -Path $env:GITHUB_ENV -Value "UUP_UPDATE_ID=$verifiedId"

      # ============================================================
      # 6. Prepare temporary directory
      # ============================================================

      - name: Prepare temporary directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "_uup_update") {
              Remove-Item `
                -LiteralPath "_uup_update" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "_uup_update" |
            Out-Null

      # ============================================================
      # 7. Download UUP conversion package
      # ============================================================

      - name: Download UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageUrl = "https://uupdump.net/get.php?id=$env:UUP_UPDATE_ID&pack=$env:LANGUAGE&edition=$env:EDITION"

          Write-Host "Build: $env:TARGET_BUILD"
          Write-Host "Update ID: $env:UUP_UPDATE_ID"
          Write-Host "Package URL: $packageUrl"

          $virtualEditions = @(
            "ProfessionalWorkstation",
            "ProfessionalEducation",
            "Education",
            "Enterprise",
            "EnterpriseS",
            "IoTEnterprise",
            "IoTEnterpriseSubscription"
          )

          $formParts = @()

          $formParts += "autodl=3"
          $formParts += "updates=1"
          $formParts += "cleanup=1"
          $formParts += "netfx=1"
          $formParts += "esd=1"

          foreach ($edition in $virtualEditions) {
              $encoded = [System.Uri]::EscapeDataString($edition)
              $formParts += "virtualEditions%5B%5D=$encoded"
          }

          $body = $formParts -join "&"

          $zipPath = Join-Path $PWD "_uup_update\uup_package.zip"

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                  Write-Host "Download attempt $attempt / 5"

                  Invoke-WebRequest `
                    -Uri $packageUrl `
                    -Method Post `
                    -ContentType "application/x-www-form-urlencoded" `
                    -Body $body `
                    -OutFile $zipPath `
                    -TimeoutSec 300

                  if (
                    (Test-Path -LiteralPath $zipPath) -and
                    ((Get-Item -LiteralPath $zipPath).Length -gt 1000)
                  ) {
                      $downloaded = $true
                      break
                  }
              }
              catch {
                  Write-Host "Download failed:"
                  Write-Host $_
              }

              Start-Sleep -Seconds 15
          }

          if (-not $downloaded) {
              throw "Failed to download UUP conversion package."
          }

          Write-Host "UUP package downloaded successfully."

      # ============================================================
      # 8. Extract UUP package
      # ============================================================

      - name: Extract UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "_uup_update\uup_package.zip"
          $extract = "_uup_update\extracted"

          if (Test-Path -LiteralPath $extract) {
              Remove-Item `
                -LiteralPath $extract `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract |
            Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          Write-Host "UUP package extracted."

      # ============================================================
      # 9. Find UUP root
      # ============================================================

      - name: Normalize UUP package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "_uup_update\extracted"

          $cmd = Get-ChildItem `
            -LiteralPath $root `
            -Recurse `
            -Filter "uup_download_windows.cmd" |
            Select-Object -First 1

          if (-not $cmd) {
              throw "uup_download_windows.cmd was not found."
          }

          $source = $cmd.Directory.FullName

          Write-Host "UUP source:"
          Write-Host $source

          $required = @(
            "uup_download_windows.cmd",
            "ConvertConfig.ini"
          )

          foreach ($file in $required) {
              $path = Join-Path $source $file

              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required file missing: $file"
              }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "UUP_SOURCE=$source"

      # ============================================================
      # 10. Verify configuration
      # ============================================================

      - name: Verify UUP configuration
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configPath = Join-Path $env:UUP_SOURCE "ConvertConfig.ini"

          if (-not (Test-Path -LiteralPath $configPath)) {
              throw "ConvertConfig.ini not found."
          }

          $config = Get-Content -LiteralPath $configPath -Raw

          Write-Host "ConvertConfig.ini:"
          Write-Host $config

          $checks = @(
            "AddUpdates",
            "Cleanup",
            "NetFx3",
            "wim2esd",
            "StartVirtual"
          )

          foreach ($check in $checks) {
              if ($config -match "(?im)^\s*$check\s*=") {
                  Write-Host "$check : found"
              }
              else {
                  Write-Host "WARNING: $check not found"
              }
          }

      # ============================================================
      # 11. Replace UUP directory
      # ============================================================

      - name: Replace entire UUP directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE
          $target = $env:FILE_NAME

          Write-Host "Source: $source"
          Write-Host "Target: $target"

          if (Test-Path -LiteralPath $target) {
              Remove-Item `
                -LiteralPath $target `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target |
            Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host "UUP directory replaced successfully."

      # ============================================================
      # 12. Update ISO workflow Build_VERSION
      # ============================================================

      - name: Update ISO workflow Build_VERSION
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $pattern = "(Build_VERSION\s*:\s*)['""][^'""]+['""]"

          if (-not [regex]::IsMatch($content, $pattern)) {
              throw "Build_VERSION was not found."
          }

          $replacement = '${1}' + "'" + $env:TARGET_BUILD + "'"

          $newContent = [regex]::Replace(
            $content,
            $pattern,
            $replacement
          )

          Set-Content `
            -LiteralPath $workflow `
            -Value $newContent `
            -Encoding utf8

          Write-Host "Build_VERSION updated to $env:TARGET_BUILD"

      # ============================================================
      # 13. Create update information
      # ============================================================

      - name: Create update information
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $info = [ordered]@{
            Channel = "Experimental"
            Ring = $env:UPDATE_RING
            Flight = $env:UPDATE_FLIGHT
            Architecture = "amd64"
            Language = "zh-cn"
            Edition = "professional"
            Build = $env:TARGET_BUILD
            MinimumBuild = $env:MIN_BUILD
            PreviousBuild = $env:CURRENT_BUILD
            UUPUpdateID = $env:UUP_UPDATE_ID
            UpdatedAt = (Get-Date).ToUniversalTime().ToString("o")
          }

          $info |
            ConvertTo-Json -Depth 10 |
            Out-File `
              -FilePath "dev-build-info.json" `
              -Encoding utf8

          Get-Content -LiteralPath "dev-build-info.json"

      # ============================================================
      # 14. Git status
      # ============================================================

      - name: Stage repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git add `
            "$env:FILE_NAME" `
            ".github/workflows/$env:ISO_WORKFLOW" `
            "dev-build-info.json"

          Write-Host ""
          Write-Host "Staged changes:"
          git diff --cached --stat

      # ============================================================
      # 15. Commit and push
      # ============================================================

      - name: Commit repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (git diff --cached --quiet) {
              Write-Host "No changes to commit."
              exit 0
          }

          git commit `
            -m "Update Windows 11 Experimental Build $env:TARGET_BUILD"

          if ($LASTEXITCODE -ne 0) {
              throw "git commit failed."
          }

          git push

          if ($LASTEXITCODE -ne 0) {
              throw "git push failed."
          }

          Write-Host "Repository pushed successfully."

      # ============================================================
      # 16. Trigger ISO workflow
      # ============================================================

      - name: Trigger ISO workflow
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Triggering ISO workflow..."
          Write-Host $env:ISO_WORKFLOW

          gh workflow run `
            "$env:ISO_WORKFLOW" `
            --ref main

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to trigger ISO workflow."
          }

          Write-Host "ISO workflow triggered successfully."

      # ============================================================
      # 17. No update
      # ============================================================

      - name: No update summary
        if: env.UPDATE_AVAILABLE == 'false'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "NO UPDATE"
          Write-Host "=========================================="
          Write-Host "Current Build: $env:CURRENT_BUILD"
          Write-Host "Dev Build: $env:TARGET_BUILD"
          Write-Host "No repository changes were made."

      # ============================================================
      # 18. Completed
      # ============================================================

      - name: Completed
        if: always()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Workflow finished"
          Write-Host "=========================================="
