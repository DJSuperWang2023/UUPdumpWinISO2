name: Auto Update Windows 11 Experimental Dev Build

on:
  # 每小时检查一次
  schedule:
    - cron: '0 * * * *'

  # 允许手动运行
  workflow_dispatch:

# 防止同一时间运行多个更新任务
concurrency:
  group: windows11-dev-build-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:

  # ============================================================
  # Microsoft Windows Insider Experimental 主频道
  # ============================================================

  MICROSOFT_EXPERIMENTAL_URL: >-
    https://learn.microsoft.com/zh-cn/windows-insider/release-notes/experimental/preview-build-26340-9233

  # ============================================================
  # UUP Dump
  # ============================================================

  UUP_API: 'https://api.uupdump.net'

  ARCH: 'amd64'
  RING: 'Dev'
  FLIGHT: 'Mainline'

  # ============================================================
  # 只使用简体中文
  # ============================================================

  LANGUAGE: 'zh-cn'

  # ============================================================
  # UUP 基础 SKU
  #
  # 专业版
  # ============================================================

  EDITION: 'professional'

  # ============================================================
  # 目标目录
  # ============================================================

  FILE_NAME: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64'

  # ============================================================
  # ISO 工作流
  # ============================================================

  ISO_WORKFLOW: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64.yml'


jobs:

  update:

    name: Detect Experimental Build and Update UUP Package

    runs-on: windows-latest

    steps:

      # ========================================================
      # 1. 检出仓库
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}


      # ========================================================
      # 2. 从现有 ISO 工作流读取当前 Build
      #
      # 不再写死 26340.9233
      #
      # 如果以后：
      #
      # 26340.9233
      # ↓
      # 26340.9500
      #
      # 或：
      #
      # 26H2
      # ↓
      # 27H2
      #
      # 都不需要修改这里
      # ========================================================

      - name: Read current Build
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path $workflow)) {

              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content $workflow -Raw

          $match = [regex]::Match(
              $content,
              "Build_VERSION:\s*['""]([^'""]+)['""]"
          )

          if (-not $match.Success) {

              throw "Build_VERSION was not found in ISO workflow."
          }

          $currentBuild = $match.Groups[1].Value.Trim()

          if ($currentBuild -notmatch '^\d+\.\d+$') {

              throw "Invalid current Build: $currentBuild"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Current repository Build"
          Write-Host "=========================================="
          Write-Host $currentBuild
          Write-Host ""

          "CURRENT_BUILD=$currentBuild" >> $env:GITHUB_ENV


      # ========================================================
      # 3. 读取 Microsoft Experimental 主频道
      #
      # 重要：
      #
      # 不读取：
      #
      # Beta
      # Experimental (26H1)
      # Experimental (Future Platforms)
      #
      # 只寻找：
      #
      # /experimental/preview-build-xxxxx-xxxx
      #
      # 这种普通 Experimental 页面
      # ========================================================

      - name: Read Microsoft Experimental sidebar
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Reading Microsoft Experimental channel"
          Write-Host "=========================================="
          Write-Host ""

          $url = $env:MICROSOFT_EXPERIMENTAL_URL

          Write-Host "Source:"
          Write-Host $url
          Write-Host ""

          $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -Headers @{
                  "User-Agent" = "Mozilla/5.0"
                  "Accept" = "text/html,application/xhtml+xml"
                  "Accept-Language" = "zh-CN,zh;q=0.9"
              } `
              -TimeoutSec 60

          $html = $response.Content

          if ([string]::IsNullOrWhiteSpace($html)) {

              throw "Microsoft returned empty HTML."
          }

          # 保存页面用于调试
          $html |
              Out-File `
                  "microsoft-experimental.html" `
                  -Encoding utf8

          Write-Host "Microsoft page downloaded."


          # ====================================================
          # 提取普通 Experimental 主频道的 Build 页面
          #
          # 只接受：
          #
          # /experimental/preview-build-26340-9233
          #
          # 而不是：
          #
          # /experimental/26h1/...
          # /experimental/future-platforms/...
          # ====================================================

          $pattern =
              'href\s*=\s*["'']([^"'']*/windows-insider/release-notes/experimental/preview-build-(\d+)-(\d+)[^"'']*)["'']'

          $matches = [regex]::Matches(
              $html,
              $pattern,
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
          )


          $builds = @()


          foreach ($m in $matches) {

              $href = $m.Groups[1].Value

              $major = [int64]$m.Groups[2].Value
              $minor = [int64]$m.Groups[3].Value

              $build = "$major.$minor"

              $builds += [PSCustomObject]@{
                  Build = $build
                  Major = $major
                  Minor = $minor
                  Url   = $href
              }
          }


          # 去重
          $builds = $builds |
              Sort-Object Build -Unique


          Write-Host ""
          Write-Host "Experimental main-channel builds found:"
          Write-Host ""


          foreach ($item in $builds) {

              Write-Host "$($item.Build)"
          }


          if ($builds.Count -eq 0) {

              throw @"
No Experimental main-channel builds were found.

The Microsoft page structure may have changed.

This workflow intentionally stops instead of downloading
Beta / Experimental 26H1 / Experimental Future Platforms.
"@
          }


          # ====================================================
          # 按 Build 数字排序
          #
          # 注意：
          #
          # 这里不是简单字符串排序
          #
          # 例如：
          #
          # 26340.9233
          # 27000.1000
          #
          # 会正确比较
          # ====================================================

          $target =
              $builds |
              Sort-Object `
                  @{Expression = "Major"; Descending = $true},
                  @{Expression = "Minor"; Descending = $true} |
              Select-Object -First 1


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Latest Experimental Build"
          Write-Host "=========================================="
          Write-Host "Build : $($target.Build)"
          Write-Host "URL   : $($target.Url)"
          Write-Host ""


          "TARGET_BUILD=$($target.Build)" >> $env:GITHUB_ENV

          "TARGET_BUILD_URL=$($target.Url)" >> $env:GITHUB_ENV


      # ========================================================
      # 4. 比较当前 Build
      # ========================================================

      - name: Compare Build
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $current = [version]$env:CURRENT_BUILD
          $target  = [version]$env:TARGET_BUILD

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Build comparison"
          Write-Host "=========================================="

          Write-Host "Current: $current"
          Write-Host "Target : $target"
          Write-Host ""


          if ($target -le $current) {

              Write-Host "No update."

              "UPDATE_AVAILABLE=false" >> $env:GITHUB_ENV

              exit 0
          }


          Write-Host ""
          Write-Host "NEW BUILD FOUND"
          Write-Host ""
          Write-Host "Old: $current"
          Write-Host "New: $target"
          Write-Host ""

          "UPDATE_AVAILABLE=true" >> $env:GITHUB_ENV


      # ========================================================
      # 5. UUP API 精确验证
      #
      # 不让 UUP API 自己猜最新版本
      #
      # 而是：
      #
      # Microsoft Experimental
      #        ↓
      # TARGET_BUILD
      #        ↓
      # UUP API 精确查询
      # ========================================================

      - name: Verify exact Build with UUP API
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Query UUP Dump API"
          Write-Host "=========================================="

          $build = $env:TARGET_BUILD

          $uri =
              "$env:UUP_API/fetchupd.php" +
              "?arch=$env:ARCH" +
              "&ring=$env:RING" +
              "&flight=$env:FLIGHT" +
              "&build=$build"

          Write-Host "Build:"
          Write-Host $build

          Write-Host ""
          Write-Host "UUP API:"
          Write-Host $uri
          Write-Host ""


          $response = Invoke-RestMethod `
              -Uri $uri `
              -Method Get `
              -TimeoutSec 120


          $response |
              ConvertTo-Json -Depth 50 |
              Out-File `
                  "uup-response.json" `
                  -Encoding utf8


          Write-Host ""
          Write-Host "UUP API response:"
          $response |
              ConvertTo-Json -Depth 20


          # ====================================================
          # 找到 updateArray
          # ====================================================

          $updates = $null


          if ($null -ne $response.response.updateArray) {

              $updates = @($response.response.updateArray)
          }
          elseif ($null -ne $response.response.updates) {

              $updates = @($response.response.updates)
          }
          elseif ($null -ne $response.response.updateInfo) {

              $updates = @($response.response.updateInfo)
          }


          if ($null -eq $updates -or $updates.Count -eq 0) {

              throw "UUP API returned no update information."
          }


          # ====================================================
          # 找精确 Build
          # ====================================================

          $matched = @()


          foreach ($item in $updates) {

              $json =
                  $item |
                  ConvertTo-Json -Depth 30

              $itemBuild = $null

              foreach ($property in @(
                  "foundBuild",
                  "build",
                  "updateBuild"
              )) {

                  if ($item.PSObject.Properties.Name -contains $property) {

                      $itemBuild =
                          [string]$item.$property

                      break
                  }
              }


              if ($itemBuild -eq $build) {

                  $matched += $item
              }
          }


          if ($matched.Count -eq 0) {

              throw @"
UUP API did not return the exact requested Build.

Requested:
$build

This workflow will NOT download another Build.
"@
          }


          # ====================================================
          # 获取 Update ID
          # ====================================================

          $updateId = $null


          foreach ($item in $matched) {

              foreach ($property in @(
                  "updateId",
                  "uuid",
                  "id"
              )) {

                  if ($item.PSObject.Properties.Name -contains $property) {

                      $candidate =
                          [string]$item.$property

                      if ($candidate -match '^[0-9a-fA-F-]{36}') {

                          $updateId = $candidate

                          break
                      }
                  }
              }

              if ($updateId) {
                  break
              }
          }


          if (-not $updateId) {

              throw "Exact Build was found, but Update ID was not returned."
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "UUP Build verified"
          Write-Host "=========================================="
          Write-Host "Build:"
          Write-Host $build
          Write-Host ""
          Write-Host "Update ID:"
          Write-Host $updateId
          Write-Host ""


          "UUP_UPDATE_ID=$updateId" >> $env:GITHUB_ENV


      # ========================================================
      # 6. 准备临时目录
      # ========================================================

      - name: Prepare temporary directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          if (Test-Path "_uup_update") {

              Remove-Item `
                  "_uup_update" `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path "_uup_update" |
              Out-Null


      # ========================================================
      # 7. 下载 UUP 转换包
      #
      # 这里严格按照你的配置：
      #
      # Windows 专业版
      # zh-cn
      # 下载并转换 ISO
      # 包括更新
      # 运行组件清理
      # 集成 .NET 3.5
      # 固实压缩
      # 虚拟版本全部
      #
      # autodl=3 = 下载 + 转换 + 虚拟版本
      # ========================================================

      - name: Download UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Download UUP conversion package"
          Write-Host "=========================================="

          Write-Host "Build:"
          Write-Host $env:TARGET_BUILD

          Write-Host ""
          Write-Host "Update ID:"
          Write-Host $env:UUP_UPDATE_ID


          # ====================================================
          # UUP Dump package URL
          # ====================================================

          $packageUrl =
              "https://uupdump.net/get.php" +
              "?id=$env:UUP_UPDATE_ID" +
              "&pack=$env:LANGUAGE" +
              "&edition=$env:EDITION"


          Write-Host ""
          Write-Host "Package URL:"
          Write-Host $packageUrl


          # ====================================================
          # 虚拟版本
          #
          # 你的要求：
          #
          # 专业工作站版
          # 专业教育版
          # 教育版
          # 企业版
          # 企业版多会话/虚拟桌面
          # IoT 企业版
          # IoT 企业版订阅
          #
          # ====================================================

          $virtualEditions = @(
              "ProfessionalWorkstation",
              "ProfessionalEducation",
              "Education",
              "Enterprise",
              "EnterpriseS",
              "IoTEnterprise",
              "IoTEnterpriseSubscription"
          )


          # ====================================================
          # 构造 application/x-www-form-urlencoded
          #
          # virtualEditions[] 必须重复发送
          # ====================================================

          $formParts = @()

          $formParts += "autodl=3"
          $formParts += "updates=1"
          $formParts += "cleanup=1"
          $formParts += "netfx=1"

          # 使用固实压缩
          $formParts += "esd=1"


          foreach ($edition in $virtualEditions) {

              $encoded =
                  [System.Uri]::EscapeDataString($edition)

              $formParts +=
                  "virtualEditions%5B%5D=$encoded"
          }


          $body =
              $formParts -join "&"


          Write-Host ""
          Write-Host "UUP conversion options:"
          Write-Host "  Language : $env:LANGUAGE"
          Write-Host "  Edition  : $env:EDITION"
          Write-Host "  Updates  : YES"
          Write-Host "  Cleanup  : YES"
          Write-Host "  NetFx3   : YES"
          Write-Host "  Solid    : YES"
          Write-Host "  Virtual  : ALL"
          Write-Host ""


          $zipPath =
              Join-Path `
                  $PWD `
                  "_uup_update\uup_package.zip"


          $downloaded = $false


          # ====================================================
          # 自动重试
          # ====================================================

          for ($attempt = 1; $attempt -le 5; $attempt++) {

              try {

                  Write-Host ""
                  Write-Host "Download attempt $attempt / 5"


                  Invoke-WebRequest `
                      -Uri $packageUrl `
                      -Method Post `
                      -ContentType "application/x-www-form-urlencoded" `
                      -Body $body `
                      -OutFile $zipPath `
                      -TimeoutSec 300


                  if (
                      (Test-Path $zipPath) -and
                      ((Get-Item $zipPath).Length -gt 1000)
                  ) {

                      $downloaded = $true

                      break
                  }

              }
              catch {

                  Write-Host ""
                  Write-Host "Download failed:"
                  Write-Host $_
              }


              Start-Sleep -Seconds 15
          }


          if (-not $downloaded) {

              throw "Failed to download UUP conversion package after 5 attempts."
          }


          Write-Host ""
          Write-Host "UUP conversion package downloaded."


      # ========================================================
      # 8. 解压 UUP 包
      # ========================================================

      - name: Extract UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $zip =
              "_uup_update\uup_package.zip"

          $extract =
              "_uup_update\extracted"


          if (Test-Path $extract) {

              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }


          New-Item `
              -ItemType Directory `
              -Path $extract |
              Out-Null


          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force


          Write-Host ""
          Write-Host "Extracted package:"


          Get-ChildItem `
              $extract `
              -Recurse `
              -File |
              Select-Object FullName, Length


      # ========================================================
      # 9. 找到真正的 UUP 根目录
      # ========================================================

      - name: Normalize UUP package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $root =
              "_uup_update\extracted"


          # ====================================================
          # 找 uup_download_windows.cmd
          # ====================================================

          $cmd =
              Get-ChildItem `
                  $root `
                  -Recurse `
                  -Filter "uup_download_windows.cmd" |
              Select-Object -First 1


          if (-not $cmd) {

              throw @"
uup_download_windows.cmd was not found.

The downloaded UUP package may be invalid.
"@
          }


          $source =
              $cmd.Directory.FullName


          Write-Host ""
          Write-Host "UUP package root:"
          Write-Host $source


          # ====================================================
          # 验证必要文件
          # ====================================================

          $required = @(
              "uup_download_windows.cmd",
              "ConvertConfig.ini"
          )


          foreach ($file in $required) {

              if (-not (Test-Path (Join-Path $source $file))) {

                  throw "Required file missing: $file"
              }
          }


          # ====================================================
          # 保存真正的 UUP 根目录
          # ====================================================

          "UUP_SOURCE=$source" >> $env:GITHUB_ENV


      # ========================================================
      # 10. 验证 UUP 包配置
      # ========================================================

      - name: Verify UUP package configuration
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verify UUP package configuration"
          Write-Host "=========================================="
          Write-Host ""


          $config =
              Get-Content `
                  (Join-Path $source "ConvertConfig.ini") `
                  -Raw


          Write-Host $config


          # ====================================================
          # 检查：
          #
          # 更新
          # 清理
          # NetFx3
          # 固实压缩
          # 虚拟版本
          # ====================================================

          foreach ($check in @(
              "AddUpdates",
              "Cleanup",
              "NetFx3",
              "wim2esd",
              "StartVirtual"
          )) {

              if (
                  $config `
                  -notmatch "(?im)^\s*$check\s*="
              ) {

                  Write-Host "WARNING: $check not found."
              }
          }


          Write-Host ""
          Write-Host "UUP package verification completed."


      # ========================================================
      # 11. 完整替换整个目录
      #
      # 旧目录：
      #
      # Windows11_Insider_Preview_Feature_Update_Dev_amd64
      #
      # 全部删除
      #
      # 包括：
      #
      # file\
      # *.cmd
      # *.bat
      # *.ini
      # *.txt
      # *.7z
      # 其他所有文件
      #
      # 然后使用新的 UUP 包完整替换
      # ========================================================

      - name: Replace entire UUP directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE
          $target = $env:FILE_NAME


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Replace entire UUP directory"
          Write-Host "=========================================="


          # ====================================================
          # 删除整个旧目录
          # ====================================================

          if (Test-Path $target) {

              Write-Host "Removing old directory..."

              Remove-Item `
                  $target `
                  -Recurse `
                  -Force
          }


          # ====================================================
          # 创建新目录
          # ====================================================

          New-Item `
              -ItemType Directory `
              -Path $target |
              Out-Null


          # ====================================================
          # 完整复制
          # ====================================================

          Copy-Item `
              "$source\*" `
              "$target\" `
              -Recurse `
              -Force


          Write-Host ""
          Write-Host "Directory replacement completed."


          Write-Host ""
          Write-Host "New directory:"
          Write-Host ""


          Get-ChildItem `
              $target `
              -Recurse `
              -File |
              Select-Object FullName, Length


      # ========================================================
      # 12. 修改 ISO 工作流 Build_VERSION
      #
      # 只修改：
      #
      # Build_VERSION
      #
      # 不进行危险的全目录数字替换
      #
      # 因为 UUP 新下载包本身已经包含正确 Build
      # ========================================================

      - name: Update ISO workflow Build_VERSION
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $workflow =
              ".github/workflows/$env:ISO_WORKFLOW"


          if (-not (Test-Path $workflow)) {

              throw "ISO workflow not found: $workflow"
          }


          $content =
              Get-Content `
                  $workflow `
                  -Raw


          $newContent =
              [regex]::Replace(
                  $content,
                  "(Build_VERSION:\s*)['""][^'""]+['""]",
                  "`$1'$env:TARGET_BUILD'"
              )


          if ($newContent -eq $content) {

              throw "Build_VERSION was not changed."
          }


          Set-Content `
              -Path $workflow `
              -Value $newContent `
              -Encoding UTF8


          Write-Host ""
          Write-Host "ISO workflow Build_VERSION updated:"
          Write-Host $env:TARGET_BUILD


      # ========================================================
      # 13. 保存 Build 信息
      # ========================================================

      - name: Create update information
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $info = [ordered]@{

              Channel = "Experimental"

              Ring = "Dev"

              Flight = "Mainline"

              Architecture = "amd64"

              Language = "zh-cn"

              Edition = "professional"

              Build = $env:TARGET_BUILD

              PreviousBuild = $env:CURRENT_BUILD

              MicrosoftReleaseNotes = $env:TARGET_BUILD_URL

              UUPUpdateID = $env:UUP_UPDATE_ID

              UpdatedAt = (Get-Date).ToUniversalTime().ToString("o")
          }


          $info |
              ConvertTo-Json -Depth 10 |
              Out-File `
                  "dev-build-info.json" `
                  -Encoding utf8


          Write-Host ""
          Get-Content "dev-build-info.json"


      # ========================================================
      # 14. 提交仓库
      # ========================================================

      - name: Commit repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"


          git config user.name `
              "github-actions[bot]"

          git config user.email `
              "41898282+github-actions[bot]@users.noreply.github.com"


          git add `
              "$env:FILE_NAME" `
              ".github/workflows/$env:ISO_WORKFLOW" `
              "dev-build-info.json"


          Write-Host ""
          Write-Host "Git status:"
          git status


          git diff --cached --stat


          git commit `
              -m "Update Windows 11 Experimental Build $env:TARGET_BUILD"


          git push


      # ========================================================
      # 15. 自动启动 ISO 工作流
      # ========================================================

      - name: Trigger ISO workflow
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |

          $ErrorActionPreference = "Stop"


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Trigger ISO workflow"
          Write-Host "=========================================="


          gh workflow run `
              "$env:ISO_WORKFLOW" `
              --ref main


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to trigger ISO workflow."
          }


          Write-Host ""
          Write-Host "ISO workflow triggered successfully."


      # ========================================================
      # 16. 无更新
      # ========================================================

      - name: No update summary
        if: env.UPDATE_AVAILABLE == 'false'
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "NO UPDATE"
          Write-Host "=========================================="

          Write-Host "Current Build:"
          Write-Host $env:CURRENT_BUILD

          Write-Host ""

          Write-Host "Microsoft Experimental Build:"
          Write-Host $env:TARGET_BUILD

          Write-Host ""

          Write-Host "No repository changes were made."


      # ========================================================
      # 17. 完成
      # ==========================================
