name: Auto Update Windows 11 Experimental Dev Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: windows11-dev-build-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  UUP_API: 'https://api.uupdump.net'
  ARCH: 'amd64'
  RING: 'Dev'
  FLIGHT: 'Mainline'
  MIN_BUILD: '26340.9233'
  UUP_SEARCH: 'Windows 11 Insider Preview'
  LANGUAGE: 'zh-cn'
  EDITION: 'professional'
  FILE_NAME: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64'
  ISO_WORKFLOW: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64.yml'

jobs:
  update:
    name: Detect Experimental Build and Update UUP Package
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ============================================================
      # 2. Read current Build
      # ============================================================

      - name: Read current Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $pattern = "Build_VERSION\s*:\s*['""]([^'""]+)['""]"
          $match = [regex]::Match($content, $pattern)

          if (-not $match.Success) {
              throw "Build_VERSION was not found in ISO workflow."
          }

          $currentBuild = $match.Groups[1].Value.Trim()

          if ($currentBuild -notmatch '^\d+\.\d+$') {
              throw "Invalid current Build: $currentBuild"
          }

          Write-Host "Current Build: $currentBuild"

          Add-Content -Path $env:GITHUB_ENV -Value "CURRENT_BUILD=$currentBuild"

      # ============================================================
      # 3. Detect Dev Experimental Build through UUP API only
      #
      # IMPORTANT:
      # - Never use fetchupd.php?build=latest.
      # - "latest" is global in UUP dump's local build database and
      #   can select Future Platforms / 29648.x.
      # - Enumerate known UUP builds with listid.php first.
      # - Inspect each candidate's stored UUP metadata with
      #   updateinfo.php and only accept a candidate explicitly
      #   identified as Dev/WIF/Mainline.
      # - MIN_BUILD is a floor, not a version lock.
      # ============================================================

      - name: Detect Dev Experimental Build from UUP API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FirstValue {
              param(
                  [object]$Object,
                  [string[]]$Names
              )

              if ($null -eq $Object) {
                  return $null
              }

              foreach ($name in $Names) {
                  if ($Object.PSObject.Properties.Name -contains $name) {
                      $value = $Object.$name
                      if ($null -ne $value -and -not [string]::IsNullOrWhiteSpace([string]$value)) {
                          return [string]$value
                      }
                  }
              }

              return $null
          }

          function Get-BuildVersion {
              param([string]$Build)

              if ($Build -notmatch '^\d+\.\d+$') {
                  return $null
              }

              return [version]$Build
          }

          function Get-NestedValues {
              param(
                  [object]$Object,
                  [string[]]$Names
              )

              $results = New-Object System.Collections.Generic.List[string]

              function Walk {
                  param([object]$Node)

                  if ($null -eq $Node) {
                      return
                  }

                  if ($Node -is [System.Collections.IDictionary]) {
                      foreach ($key in $Node.Keys) {
                          $value = $Node[$key]

                          foreach ($name in $Names) {
                              if ([string]::Equals([string]$key, $name, [System.StringComparison]::OrdinalIgnoreCase)) {
                                  if ($null -ne $value -and -not [string]::IsNullOrWhiteSpace([string]$value)) {
                                      $results.Add([string]$value)
                                  }
                              }
                          }

                          if ($value -is [System.Collections.IDictionary] -or
                              $value -is [System.Collections.IEnumerable] -and
                              $value -isnot [string]) {
                              Walk $value
                          }
                      }

                      return
                  }

                  if ($Node -is [System.Collections.IEnumerable] -and $Node -isnot [string]) {
                      foreach ($child in $Node) {
                          Walk $child
                      }

                      return
                  }

                  foreach ($property in $Node.PSObject.Properties) {
                      foreach ($name in $Names) {
                          if ([string]::Equals($property.Name, $name, [System.StringComparison]::OrdinalIgnoreCase)) {
                              if ($null -ne $property.Value -and
                                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                                  $results.Add([string]$property.Value)
                              }
                          }
                      }

                      if ($property.Value -is [System.Collections.IDictionary] -or
                          $property.Value -is [System.Collections.IEnumerable] -and
                          $property.Value -isnot [string]) {
                          Walk $property.Value
                      }
                  }
              }

              Walk $Object
              return @($results | Select-Object -Unique)
          }

          $minBuild = Get-BuildVersion $env:MIN_BUILD

          if ($null -eq $minBuild) {
              throw "Invalid MIN_BUILD: $env:MIN_BUILD"
          }

          Write-Host "Minimum accepted Build: $env:MIN_BUILD"
          Write-Host "UUP channel: $env:RING / $env:FLIGHT"

          # One listid request only. Do not call fetchupd.php with build=latest.
          $listUri = "$env:UUP_API/listid.php?search=$([uri]::EscapeDataString($env:UUP_SEARCH))&sortByDate=1"

          Write-Host "Querying UUP build database:"
          Write-Host $listUri

          $listResponse = Invoke-RestMethod `
            -Uri $listUri `
            -Method Get `
            -TimeoutSec 120

          $listResponse |
            ConvertTo-Json -Depth 50 |
            Out-File -FilePath "uup-listid-response.json" -Encoding utf8

          if ($null -ne $listResponse.error) {
              throw "UUP listid.php error: $($listResponse.error)"
          }

          $records = @()

          if ($null -ne $listResponse.response.builds) {
              $records = @($listResponse.response.builds)
          }
          elseif ($null -ne $listResponse.builds) {
              $records = @($listResponse.builds)
          }
          elseif ($null -ne $listResponse.response) {
              $records = @($listResponse.response)
          }

          if ($records.Count -eq 0) {
              throw "UUP listid.php returned no build records."
          }

          $candidates = @()

          foreach ($record in $records) {
              $build = Get-FirstValue $record @("build","foundBuild","version")
              $uuid = Get-FirstValue $record @("uuid","updateId","id")
              $title = Get-FirstValue $record @("title","updateTitle","name")
              $arch = Get-FirstValue $record @("arch","architecture")

              if ($build -notmatch '^\d+\.\d+$') {
                  continue
              }

              $buildVersion = Get-BuildVersion $build

              if ($null -eq $buildVersion -or $buildVersion -lt $minBuild) {
                  continue
              }

              if ($arch -and $arch -notmatch '^(amd64|x64)$') {
                  continue
              }

              if ($uuid -notmatch '^[0-9a-fA-F-]{36}$') {
                  continue
              }

              $candidates += [PSCustomObject]@{
                  Build = $build
                  BuildVersion = $buildVersion
                  UUID = $uuid
                  Title = $title
                  Arch = $arch
              }
          }

          $candidates = @(
              $candidates |
              Sort-Object BuildVersion -Descending |
              Select-Object -First 12
          )

          if ($candidates.Count -eq 0) {
              throw "No UUP builds at or above MIN_BUILD=$env:MIN_BUILD were found."
          }

          Write-Host ""
          Write-Host "Top UUP candidates:"
          $candidates | Format-Table Build, UUID, Title -AutoSize | Out-Host

          $accepted = $null

          foreach ($candidate in $candidates) {
              Write-Host ""
              Write-Host "Inspecting UUP metadata for Build $($candidate.Build) / $($candidate.UUID)"

              $infoUri = "$env:UUP_API/updateinfo.php?updateId=$($candidate.UUID)&ignoreFiles=true"

              try {
                  $info = Invoke-RestMethod `
                    -Uri $infoUri `
                    -Method Get `
                    -TimeoutSec 120
              }
              catch {
                  Write-Host "updateinfo.php failed for $($candidate.Build): $($_.Exception.Message)"
                  Start-Sleep -Seconds 3
                  continue
              }

              $rings = Get-NestedValues $info @("ring","channel")
              $flights = Get-NestedValues $info @("flight")
              $branches = Get-NestedValues $info @("branch","buildBranch","fltBranch")

              $ringText = ($rings -join " | ")
              $flightText = ($flights -join " | ")
              $branchText = ($branches -join " | ")

              Write-Host "  Ring/Channel: $ringText"
              Write-Host "  Flight       : $flightText"
              Write-Host "  Branch       : $branchText"

              $isDev = $false

              foreach ($value in $rings) {
                  if ($value -match '^(DEV|WIF|WIS)$') {
                      $isDev = $true
                      break
                  }
              }

              $isExcluded = $false

              foreach ($value in ($rings + $flights)) {
                  if ($value -match '(?i)^(CANARY|BETA|RELEASEPREVIEW|RP|WIF_CANARY|FUTURE|FUTUREPLATFORM)$') {
                      $isExcluded = $true
                  }
              }

              if (-not $isDev -or $isExcluded) {
                  Write-Host "  -> REJECTED: not explicitly identified as Dev/WIF."
                  continue
              }

              $accepted = [PSCustomObject]@{
                  Build = $candidate.Build
                  UUID = $candidate.UUID
                  Title = $candidate.Title
                  Ring = if ($rings.Count -gt 0) { $rings[0] } else { "Dev" }
                  Flight = if ($flights.Count -gt 0) { $flights[0] } else { $env:FLIGHT }
              }

              Write-Host "  -> ACCEPTED as Dev Experimental."
              break
          }

          if ($null -eq $accepted) {
              throw "No candidate could be positively identified as Windows 11 Dev Experimental through UUP API metadata."
          }

          Write-Host ""
          Write-Host "Selected Dev Experimental Build: $($accepted.Build)"
          Write-Host "Update ID: $($accepted.UUID)"

          Add-Content -Path $env:GITHUB_ENV -Value "TARGET_BUILD=$($accepted.Build)"
          Add-Content -Path $env:GITHUB_ENV -Value "UUP_UPDATE_ID=$($accepted.UUID)"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_RING=$($accepted.Ring)"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_FLIGHT=$($accepted.Flight)"
          Add-Content -Path $env:GITHUB_ENV -Value "TARGET_BUILD_URL="

      # ============================================================
      # 4. Compare Build
      # ============================================================

      - name: Compare Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $current = [version]$env:CURRENT_BUILD
          $target = [version]$env:TARGET_BUILD

          Write-Host "Minimum Build: $env:MIN_BUILD"
          Write-Host "Current Build: $current"
          Write-Host "Target Build : $target"

          if ($target -lt [version]$env:MIN_BUILD) {
              throw "Target Build $target is below MIN_BUILD $env:MIN_BUILD"
          }

          if ($target -le $current) {
              Write-Host "No update required."
              Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_AVAILABLE=false"
              exit 0
          }

          Write-Host "New Dev Experimental Build detected."
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_AVAILABLE=true"

      # ============================================================
      # 5. No second UUP verification request.
      #
      # UUP updateinfo.php already provided the Update ID for the
      # selected candidate. Avoiding a second fetchupd.php request
      # prevents USER_RATE_LIMITED and avoids re-selecting latest.
      # ============================================================

      - name: Confirm selected UUP package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:UUP_UPDATE_ID -notmatch '^[0-9a-fA-F-]{36}$') {
              throw "Invalid UUP Update ID: $env:UUP_UPDATE_ID"
          }

          Write-Host "Dev Experimental Build: $env:TARGET_BUILD"
          Write-Host "UUP Update ID: $env:UUP_UPDATE_ID"
          Write-Host "Ring: $env:UPDATE_RING"
          Write-Host "Flight: $env:UPDATE_FLIGHT"
          Write-Host "No second fetchupd.php request will be made."

      # ============================================================
      # 6. Prepare temporary directory
      # ============================================================

      - name: Prepare temporary directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "_uup_update") {
              Remove-Item `
                -LiteralPath "_uup_update" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "_uup_update" |
            Out-Null

      # ============================================================
      # 7. Download UUP conversion package
      # ============================================================

      - name: Download UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageUrl = "https://uupdump.net/get.php?id=$env:UUP_UPDATE_ID&pack=$env:LANGUAGE&edition=$env:EDITION"

          Write-Host "Build: $env:TARGET_BUILD"
          Write-Host "Update ID: $env:UUP_UPDATE_ID"
          Write-Host "Package URL: $packageUrl"

          $virtualEditions = @(
            "ProfessionalWorkstation",
            "ProfessionalEducation",
            "Education",
            "Enterprise",
            "EnterpriseS",
            "IoTEnterprise",
            "IoTEnterpriseSubscription"
          )

          $formParts = @()

          $formParts += "autodl=3"
          $formParts += "updates=1"
          $formParts += "cleanup=1"
          $formParts += "netfx=1"
          $formParts += "esd=1"

          foreach ($edition in $virtualEditions) {
              $encoded = [System.Uri]::EscapeDataString($edition)
              $formParts += "virtualEditions%5B%5D=$encoded"
          }

          $body = $formParts -join "&"

          $zipPath = Join-Path $PWD "_uup_update\uup_package.zip"

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                  Write-Host "Download attempt $attempt / 5"

                  Invoke-WebRequest `
                    -Uri $packageUrl `
                    -Method Post `
                    -ContentType "application/x-www-form-urlencoded" `
                    -Body $body `
                    -OutFile $zipPath `
                    -TimeoutSec 300

                  if (
                    (Test-Path -LiteralPath $zipPath) -and
                    ((Get-Item -LiteralPath $zipPath).Length -gt 1000)
                  ) {
                      $downloaded = $true
                      break
                  }
              }
              catch {
                  Write-Host "Download failed:"
                  Write-Host $_
              }

              Start-Sleep -Seconds 15
          }

          if (-not $downloaded) {
              throw "Failed to download UUP conversion package."
          }

          Write-Host "UUP package downloaded successfully."

      # ============================================================
      # 8. Extract UUP package
      # ============================================================

      - name: Extract UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "_uup_update\uup_package.zip"
          $extract = "_uup_update\extracted"

          if (Test-Path -LiteralPath $extract) {
              Remove-Item `
                -LiteralPath $extract `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract |
            Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          Write-Host "UUP package extracted."

      # ============================================================
      # 9. Find UUP root
      # ============================================================

      - name: Normalize UUP package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "_uup_update\extracted"

          $cmd = Get-ChildItem `
            -LiteralPath $root `
            -Recurse `
            -Filter "uup_download_windows.cmd" |
            Select-Object -First 1

          if (-not $cmd) {
              throw "uup_download_windows.cmd was not found."
          }

          $source = $cmd.Directory.FullName

          Write-Host "UUP source:"
          Write-Host $source

          $required = @(
            "uup_download_windows.cmd",
            "ConvertConfig.ini"
          )

          foreach ($file in $required) {
              $path = Join-Path $source $file

              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required file missing: $file"
              }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "UUP_SOURCE=$source"

      # ============================================================
      # 10. Verify configuration
      # ============================================================

      - name: Verify UUP configuration
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configPath = Join-Path $env:UUP_SOURCE "ConvertConfig.ini"

          if (-not (Test-Path -LiteralPath $configPath)) {
              throw "ConvertConfig.ini not found."
          }

          $config = Get-Content -LiteralPath $configPath -Raw

          Write-Host "ConvertConfig.ini:"
          Write-Host $config

          $checks = @(
            "AddUpdates",
            "Cleanup",
            "NetFx3",
            "wim2esd",
            "StartVirtual"
          )

          foreach ($check in $checks) {
              if ($config -match "(?im)^\s*$check\s*=") {
                  Write-Host "$check : found"
              }
              else {
                  Write-Host "WARNING: $check not found"
              }
          }

      # ============================================================
      # 11. Replace UUP directory
      # ============================================================

      - name: Replace entire UUP directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE
          $target = $env:FILE_NAME

          Write-Host "Source: $source"
          Write-Host "Target: $target"

          if (Test-Path -LiteralPath $target) {
              Remove-Item `
                -LiteralPath $target `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target |
            Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host "UUP directory replaced successfully."

      # ============================================================
      # 12. Update ISO workflow Build_VERSION
      # ============================================================

      - name: Update ISO workflow Build_VERSION
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $pattern = "(Build_VERSION\s*:\s*)['""][^'""]+['""]"

          if (-not [regex]::IsMatch($content, $pattern)) {
              throw "Build_VERSION was not found."
          }

          $replacement = '${1}' + "'" + $env:TARGET_BUILD + "'"

          $newContent = [regex]::Replace(
            $content,
            $pattern,
            $replacement
          )

          Set-Content `
            -LiteralPath $workflow `
            -Value $newContent `
            -Encoding utf8

          Write-Host "Build_VERSION updated to $env:TARGET_BUILD"

      # ============================================================
      # 13. Create update information
      # ============================================================

      - name: Create update information
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $info = [ordered]@{
            Channel = "Experimental"
            Ring = "Dev"
            Flight = "Mainline"
            Architecture = "amd64"
            Language = "zh-cn"
            Edition = "professional"
            Build = $env:TARGET_BUILD
            PreviousBuild = $env:CURRENT_BUILD
            UUPUpdateID = $env:UUP_UPDATE_ID
            UpdatedAt = (Get-Date).ToUniversalTime().ToString("o")
          }

          $info |
            ConvertTo-Json -Depth 10 |
            Out-File `
              -FilePath "dev-build-info.json" `
              -Encoding utf8

          Get-Content -LiteralPath "dev-build-info.json"

      # ============================================================
      # 14. Git status
      # ============================================================

      - name: Stage repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git add `
            "$env:FILE_NAME" `
            ".github/workflows/$env:ISO_WORKFLOW" `
            "dev-build-info.json"

          Write-Host ""
          Write-Host "Staged changes:"
          git diff --cached --stat

      # ============================================================
      # 15. Commit and push
      # ============================================================

      - name: Commit repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (git diff --cached --quiet) {
              Write-Host "No changes to commit."
              exit 0
          }

          git commit `
            -m "Update Windows 11 Experimental Build $env:TARGET_BUILD"

          if ($LASTEXITCODE -ne 0) {
              throw "git commit failed."
          }

          git push

          if ($LASTEXITCODE -ne 0) {
              throw "git push failed."
          }

          Write-Host "Repository pushed successfully."

      # ============================================================
      # 16. Trigger ISO workflow
      # ============================================================

      - name: Trigger ISO workflow
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Triggering ISO workflow..."
          Write-Host $env:ISO_WORKFLOW

          gh workflow run `
            "$env:ISO_WORKFLOW" `
            --ref main

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to trigger ISO workflow."
          }

          Write-Host "ISO workflow triggered successfully."

      # ============================================================
      # 17. No update
      # ============================================================

      - name: No update summary
        if: env.UPDATE_AVAILABLE == 'false'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "NO UPDATE"
          Write-Host "=========================================="
          Write-Host "Current Build: $env:CURRENT_BUILD"
          Write-Host "Microsoft Build: $env:TARGET_BUILD"
          Write-Host "No repository changes were made."

      # ============================================================
      # 18. Completed
      # ============================================================

      - name: Completed
        if: always()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Workflow finished"
          Write-Host "=========================================="
