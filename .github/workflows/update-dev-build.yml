name: Auto Update Windows 11 Experimental Dev Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: windows11-dev-build-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  UUP_API: 'https://api.uupdump.net'
  ARCH: 'amd64'
  LANGUAGE: 'zh-cn'
  EDITION: 'professional'
  FILE_NAME: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64'
  ISO_WORKFLOW: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64.yml'

jobs:
  update:
    name: Detect Experimental Build and Update UUP Package
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ============================================================
      # 2. Read current Build
      # ============================================================

      - name: Read current Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $pattern = "Build_VERSION\s*:\s*['""]([^'""]+)['""]"
          $match = [regex]::Match($content, $pattern)

          if (-not $match.Success) {
              throw "Build_VERSION was not found in ISO workflow."
          }

          $currentBuild = $match.Groups[1].Value.Trim()

          if ($currentBuild -notmatch '^\d+\.\d+$') {
              throw "Invalid current Build: $currentBuild"
          }

          Write-Host "Current Build: $currentBuild"

          Add-Content -Path $env:GITHUB_ENV -Value "CURRENT_BUILD=$currentBuild"

      # ============================================================      # ============================================================
      # 3. Query UUP API only
      #
      # IMPORTANT:
      # - The update channel is hard-locked to Windows 11 Experimental
      #   (UUP API: Ring=Dev, Flight=Mainline).
      # - This is NOT 26H1, NOT a future platform, and NOT Beta/RP.
      # - Only the update channel is locked.
      # - Do NOT lock BuildBranch / kernel codename such as ge_prerelease.
      #   Build number, branch and other internal identifiers are expected
      #   to change as the Experimental channel evolves.
      # ============================================================

      - name: Query UUP API for Experimental channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Channel lock: Windows 11 Experimental / Dev Mainline.
          # Do not add BuildBranch filtering here.
          $arch  = $env:ARCH
          $ring  = "Dev"
          $flight = "Mainline"

          $uri = "$env:UUP_API/fetchupd.php?arch=$([uri]::EscapeDataString($arch))&ring=$([uri]::EscapeDataString($ring))&flight=$([uri]::EscapeDataString($flight))"

          Write-Host "UUP API channel query:"
          Write-Host "API  : $env:UUP_API"
          Write-Host "Arch : $arch"
          Write-Host "Ring : $ring"
          Write-Host "Flight: $flight"
          Write-Host "BuildBranch: NOT LOCKED"
          Write-Host "Kernel codename: NOT LOCKED"

          $response = Invoke-RestMethod `
            -Uri $uri `
            -Method Get `
            -TimeoutSec 120

          $response |
            ConvertTo-Json -Depth 100 |
            Out-File -FilePath "uup-response.json" -Encoding utf8

          if ($null -eq $response) {
              throw "UUP API returned an empty response."
          }

          if ($null -ne $response.response) {
              $payload = $response.response
          }
          else {
              $payload = $response
          }

          $updates = $null

          foreach ($property in @(
              "updateArray",
              "updates",
              "updateInfo",
              "builds"
          )) {
              if ($payload.PSObject.Properties.Name -contains $property) {
                  $candidate = @($payload.$property)

                  if ($candidate.Count -gt 0) {
                      $updates = $candidate
                      break
                  }
              }
          }

          if ($null -eq $updates -or $updates.Count -eq 0) {
              throw "UUP API returned no builds for the locked Experimental channel."
          }

          function Get-PropertyValue {
              param(
                  [Parameter(Mandatory = $true)]
                  $Object,

                  [Parameter(Mandatory = $true)]
                  [string[]]$Names
              )

              foreach ($name in $Names) {
                  if ($Object.PSObject.Properties.Name -contains $name) {
                      $value = $Object.$name

                      if ($null -ne $value -and -not [string]::IsNullOrWhiteSpace([string]$value)) {
                          return [string]$value
                      }
                  }
              }

              return $null
          }

          $builds = @()

          foreach ($item in $updates) {
              $buildText = Get-PropertyValue -Object $item -Names @(
                  "foundBuild",
                  "build",
                  "updateBuild",
                  "buildNumber",
                  "buildVersion"
              )

              if ([string]::IsNullOrWhiteSpace($buildText)) {
                  continue
              }

              $buildMatch = [regex]::Match($buildText, '^\s*(\d+)\.(\d+)(?:\.(\d+))?')

              if (-not $buildMatch.Success) {
                  continue
              }

              $major = [int64]$buildMatch.Groups[1].Value
              $minor = [int64]$buildMatch.Groups[2].Value
              $build = "$major.$minor"

              $builds += [PSCustomObject]@{
                  Build = $build
                  Major = $major
                  Minor = $minor
                  RawBuild = $buildText
                  Item = $item
              }
          }

          if ($builds.Count -eq 0) {
              throw "UUP API returned data, but no valid Windows build number was found."
          }

          $target = $builds |
              Sort-Object `
                @{Expression = "Major"; Descending = $true},
                @{Expression = "Minor"; Descending = $true} |
              Select-Object -First 1

          if ($null -eq $target) {
              throw "Unable to determine the newest build from UUP API."
          }

          $matched = @(
              $builds |
              Where-Object { $_.Build -eq $target.Build }
          )

          if ($matched.Count -eq 0) {
              throw "The selected build was not present in the UUP API result."
          }

          $updateId = $null

          foreach ($entry in $matched) {
              foreach ($property in @(
                  "updateId",
                  "uuid",
                  "id"
              )) {
                  if ($entry.Item.PSObject.Properties.Name -contains $property) {
                      $candidate = [string]$entry.Item.$property

                      if ($candidate -match '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}') {
                          $updateId = $candidate
                          break
                      }
                  }
              }

              if ($updateId) {
                  break
              }
          }

          # Some UUP API responses expose updateId in nested update data.
          if (-not $updateId) {
              foreach ($entry in $matched) {
                  $json = $entry.Item | ConvertTo-Json -Depth 100

                  $idMatch = [regex]::Match(
                      $json,
                      '(?i)"(?:updateId|uuid|id)"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'
                  )

                  if ($idMatch.Success) {
                      $updateId = $idMatch.Groups[1].Value
                      break
                  }
              }
          }

          if (-not $updateId) {
              throw "UUP API returned build $($target.Build), but no Update ID was found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LOCKED UPDATE CHANNEL"
          Write-Host "=========================================="
          Write-Host "Channel : Windows 11 Experimental"
          Write-Host "Ring    : Dev"
          Write-Host "Flight  : Mainline"
          Write-Host "Build   : $($target.Build)"
          Write-Host "UpdateID: $updateId"
          Write-Host "BuildBranch / kernel codename: NOT LOCKED"
          Write-Host "=========================================="

          Add-Content -Path $env:GITHUB_ENV -Value "TARGET_BUILD=$($target.Build)"
          Add-Content -Path $env:GITHUB_ENV -Value "UUP_UPDATE_ID=$updateId"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_CHANNEL=Windows 11 Experimental"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_RING=Dev"
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_FLIGHT=Mainline"

      # ============================================================
      # 4. Compare Build
      # ============================================================

      - name: Compare Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $current = [version]$env:CURRENT_BUILD
          $target = [version]$env:TARGET_BUILD

          Write-Host "Current Build: $current"
          Write-Host "Target Build : $target"
          Write-Host "Channel      : $env:UPDATE_CHANNEL"
          Write-Host "Ring         : $env:UPDATE_RING"
          Write-Host "Flight       : $env:UPDATE_FLIGHT"

          if ($target -le $current) {
              Write-Host "No update required."
              Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_AVAILABLE=false"
              exit 0
          }

          Write-Host "New Experimental channel Build detected."
          Add-Content -Path $env:GITHUB_ENV -Value "UPDATE_AVAILABLE=true"

      # ============================================================
      # 5. Prepare temporary directory
      # ============================================================

      - name: Prepare temporary directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "_uup_update") {
              Remove-Item `
                -LiteralPath "_uup_update" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "_uup_update" |
            Out-Null

      # ============================================================
      # 6. Download UUP conversion package
      # ============================================================

      - name: Download UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageUrl = "https://uupdump.net/get.php?id=$env:UUP_UPDATE_ID&pack=$env:LANGUAGE&edition=$env:EDITION"

          Write-Host "Build: $env:TARGET_BUILD"
          Write-Host "Update ID: $env:UUP_UPDATE_ID"
          Write-Host "Package URL: $packageUrl"

          $virtualEditions = @(
            "ProfessionalWorkstation",
            "ProfessionalEducation",
            "Education",
            "Enterprise",
            "EnterpriseS",
            "IoTEnterprise",
            "IoTEnterpriseSubscription"
          )

          $formParts = @()

          $formParts += "autodl=3"
          $formParts += "updates=1"
          $formParts += "cleanup=1"
          $formParts += "netfx=1"
          $formParts += "esd=1"

          foreach ($edition in $virtualEditions) {
              $encoded = [System.Uri]::EscapeDataString($edition)
              $formParts += "virtualEditions%5B%5D=$encoded"
          }

          $body = $formParts -join "&"

          $zipPath = Join-Path $PWD "_uup_update\uup_package.zip"

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                  Write-Host "Download attempt $attempt / 5"

                  Invoke-WebRequest `
                    -Uri $packageUrl `
                    -Method Post `
                    -ContentType "application/x-www-form-urlencoded" `
                    -Body $body `
                    -OutFile $zipPath `
                    -TimeoutSec 300

                  if (
                    (Test-Path -LiteralPath $zipPath) -and
                    ((Get-Item -LiteralPath $zipPath).Length -gt 1000)
                  ) {
                      $downloaded = $true
                      break
                  }
              }
              catch {
                  Write-Host "Download failed:"
                  Write-Host $_
              }

              Start-Sleep -Seconds 15
          }

          if (-not $downloaded) {
              throw "Failed to download UUP conversion package."
          }

          Write-Host "UUP package downloaded successfully."

      # ============================================================
      # 7. Extract UUP conversion package
      # ============================================================

      - name: Extract UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "_uup_update\uup_package.zip"
          $extract = "_uup_update\extracted"

          if (Test-Path -LiteralPath $extract) {
              Remove-Item `
                -LiteralPath $extract `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract |
            Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          Write-Host "UUP package extracted."

      # ============================================================
      # 8. Find UUP root
      # ============================================================

      - name: Normalize UUP package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "_uup_update\extracted"

          $cmd = Get-ChildItem `
            -LiteralPath $root `
            -Recurse `
            -Filter "uup_download_windows.cmd" |
            Select-Object -First 1

          if (-not $cmd) {
              throw "uup_download_windows.cmd was not found."
          }

          $source = $cmd.Directory.FullName

          Write-Host "UUP source:"
          Write-Host $source

          $required = @(
            "uup_download_windows.cmd",
            "ConvertConfig.ini"
          )

          foreach ($file in $required) {
              $path = Join-Path $source $file

              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required file missing: $file"
              }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "UUP_SOURCE=$source"

      # ============================================================
      # 9. Verify UUP configuration
      # ============================================================

      - name: Verify UUP configuration
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configPath = Join-Path $env:UUP_SOURCE "ConvertConfig.ini"

          if (-not (Test-Path -LiteralPath $configPath)) {
              throw "ConvertConfig.ini not found."
          }

          $config = Get-Content -LiteralPath $configPath -Raw

          Write-Host "ConvertConfig.ini:"
          Write-Host $config

          $checks = @(
            "AddUpdates",
            "Cleanup",
            "NetFx3",
            "wim2esd",
            "StartVirtual"
          )

          foreach ($check in $checks) {
              if ($config -match "(?im)^\s*$check\s*=") {
                  Write-Host "$check : found"
              }
              else {
                  Write-Host "WARNING: $check not found"
              }
          }

      # ============================================================
      # 10. Replace UUP directory
      # ============================================================

      - name: Replace entire UUP directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE
          $target = $env:FILE_NAME

          Write-Host "Source: $source"
          Write-Host "Target: $target"

          if (Test-Path -LiteralPath $target) {
              Remove-Item `
                -LiteralPath $target `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target |
            Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host "UUP directory replaced successfully."

      # ============================================================
      # 11. Update ISO workflow Build_VERSION
      # ============================================================

      - name: Update ISO workflow Build_VERSION
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $pattern = "(Build_VERSION\s*:\s*)['""][^'""]+['""]"

          if (-not [regex]::IsMatch($content, $pattern)) {
              throw "Build_VERSION was not found."
          }

          $replacement = '${1}' + "'" + $env:TARGET_BUILD + "'"

          $newContent = [regex]::Replace(
            $content,
            $pattern,
            $replacement
          )

          Set-Content `
            -LiteralPath $workflow `
            -Value $newContent `
            -Encoding utf8

          Write-Host "Build_VERSION updated to $env:TARGET_BUILD"

      # ============================================================
      # 12. Create update information
      # ============================================================

      - name: Create update information
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $info = [ordered]@{
            Channel = "Windows 11 Experimental"
            Ring = "Dev"
            Flight = "Mainline"
            Architecture = $env:ARCH
            Language = $env:LANGUAGE
            Edition = $env:EDITION
            Build = $env:TARGET_BUILD
            PreviousBuild = $env:CURRENT_BUILD
            UUPUpdateID = $env:UUP_UPDATE_ID
            UpdatedAt = (Get-Date).ToUniversalTime().ToString("o")
          }

          $info |
            ConvertTo-Json -Depth 10 |
            Out-File `
              -FilePath "dev-build-info.json" `
              -Encoding utf8

          Get-Content -LiteralPath "dev-build-info.json"

      # ============================================================
      # 13. Git status
      # ============================================================

      - name: Stage repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git add `
            "$env:FILE_NAME" `
            ".github/workflows/$env:ISO_WORKFLOW" `
            "dev-build-info.json"

          Write-Host ""
          Write-Host "Staged changes:"
          git diff --cached --stat

      # ============================================================
      # 14. Commit and push
      # ============================================================

      - name: Commit repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (git diff --cached --quiet) {
              Write-Host "No changes to commit."
              exit 0
          }

          git commit `
            -m "Update Windows 11 Experimental Build $env:TARGET_BUILD"

          if ($LASTEXITCODE -ne 0) {
              throw "git commit failed."
          }

          git push

          if ($LASTEXITCODE -ne 0) {
              throw "git push failed."
          }

          Write-Host "Repository pushed successfully."

      # ============================================================
      # 15. Trigger ISO workflow
      # ============================================================

      - name: Trigger ISO workflow
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Triggering ISO workflow..."
          Write-Host $env:ISO_WORKFLOW

          gh workflow run `
            "$env:ISO_WORKFLOW" `
            --ref main

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to trigger ISO workflow."
          }

          Write-Host "ISO workflow triggered successfully."

      # ============================================================
      # 16. No update
      # ============================================================

      - name: No update summary
        if: env.UPDATE_AVAILABLE == 'false'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "NO UPDATE"
          Write-Host "=========================================="
          Write-Host "Current Build : $env:CURRENT_BUILD"
          Write-Host "UUP Build     : $env:TARGET_BUILD"
          Write-Host "Channel       : $env:UPDATE_CHANNEL"
          Write-Host "Ring          : $env:UPDATE_RING"
          Write-Host "Flight        : $env:UPDATE_FLIGHT"
          Write-Host "No repository changes were made."

      # ============================================================
      # 17. Completed
      # ============================================================

      - name: Completed
        if: always()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Workflow finished"
          Write-Host "=========================================="
