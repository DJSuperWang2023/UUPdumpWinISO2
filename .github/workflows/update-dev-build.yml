name: Auto Update Windows 11 Experimental Dev Build

on:
  # 每小时检查一次
  schedule:
    - cron: '0 * * * *'

  # 允许手动运行
  workflow_dispatch:

# 防止同一时间运行多个更新任务
concurrency:
  group: windows11-dev-build-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  # ============================================================
  # Microsoft Windows Insider Experimental 主频道
  # ============================================================

  MICROSOFT_EXPERIMENTAL_URL: 'https://learn.microsoft.com/zh-cn/windows-insider/release-notes/experimental/preview-build-26340-9233'

  # ============================================================
  # UUP Dump
  # ============================================================

  UUP_API: 'https://api.uupdump.net'

  ARCH: 'amd64'
  RING: 'Dev'
  FLIGHT: 'Mainline'

  # ============================================================
  # 语言
  # ============================================================

  LANGUAGE: 'zh-cn'

  # ============================================================
  # 基础 SKU
  # ============================================================

  EDITION: 'professional'

  # ============================================================
  # UUP 目录
  # ============================================================

  FILE_NAME: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64'

  # ============================================================
  # ISO 工作流
  # ============================================================

  ISO_WORKFLOW: 'Windows11_Insider_Preview_Feature_Update_Dev_amd64.yml'


jobs:
  update:
    name: Detect Experimental Build and Update UUP Package

    runs-on: windows-latest

    steps:

      # ========================================================
      # 1. 检出仓库
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}


      # ========================================================
      # 2. 读取当前 Build
      # ========================================================

      - name: Read current Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content -LiteralPath $workflow -Raw

          $match = [regex]::Match(
              $content,
              "Build_VERSION\s*:\s*['""]([^'""]+)['""]"
          )

          if (-not $match.Success) {
              throw "Build_VERSION was not found in ISO workflow."
          }

          $currentBuild = $match.Groups[1].Value.Trim()

          if ($currentBuild -notmatch '^\d+\.\d+$') {
              throw "Invalid current Build: $currentBuild"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Current repository Build"
          Write-Host "=========================================="
          Write-Host $currentBuild
          Write-Host ""

          "CURRENT_BUILD=$currentBuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      # ========================================================
      # 3. 读取 Microsoft Experimental 主频道
      # ========================================================

      - name: Read Microsoft Experimental sidebar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Reading Microsoft Experimental channel"
          Write-Host "=========================================="
          Write-Host ""

          $url = $env:MICROSOFT_EXPERIMENTAL_URL

          Write-Host "Source:"
          Write-Host $url
          Write-Host ""

          $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -Headers @{
                  "User-Agent" = "Mozilla/5.0"
                  "Accept" = "text/html,application/xhtml+xml"
                  "Accept-Language" = "zh-CN,zh;q=0.9"
              } `
              -TimeoutSec 60

          $html = $response.Content

          if ([string]::IsNullOrWhiteSpace($html)) {
              throw "Microsoft returned empty HTML."
          }

          $html | Out-File `
              -FilePath "microsoft-experimental.html" `
              -Encoding utf8

          Write-Host "Microsoft page downloaded."

          # ====================================================
          # 只匹配普通 Experimental Preview Build
          #
          # 允许：
          #
          # /experimental/preview-build-26340-9233
          #
          # 不匹配：
          #
          # /experimental/26h1/...
          # /experimental/future-platforms/...
          # ====================================================

          $pattern = 'href\s*=\s*["'']([^"'']*/windows-insider/release-notes/experimental/preview-build-(\d+)-(\d+)[^"'']*)["'']'

          $matches = [regex]::Matches(
              $html,
              $pattern,
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
          )

          $builds = @()

          foreach ($m in $matches) {
              $href = $m.Groups[1].Value

              $major = [int64]$m.Groups[2].Value
              $minor = [int64]$m.Groups[3].Value

              $build = "$major.$minor"

              $builds += [PSCustomObject]@{
                  Build = $build
                  Major = $major
                  Minor = $minor
                  Url   = $href
              }
          }

          $builds = @(
              $builds |
              Sort-Object Build -Unique
          )

          Write-Host ""
          Write-Host "Experimental main-channel builds found:"
          Write-Host ""

          foreach ($item in $builds) {
              Write-Host "$($item.Build)"
          }

          if ($builds.Count -eq 0) {
              throw @"
No Experimental main-channel builds were found.

The Microsoft page structure may have changed.

This workflow intentionally stops instead of downloading
Beta / Experimental 26H1 / Experimental Future Platforms.
"@
          }

          # ====================================================
          # 按数字排序
          # ====================================================

          $target = $builds |
              Sort-Object `
                  @{ Expression = "Major"; Descending = $true },
                  @{ Expression = "Minor"; Descending = $true } |
              Select-Object -First 1

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Latest Experimental Build"
          Write-Host "=========================================="
          Write-Host "Build : $($target.Build)"
          Write-Host "URL   : $($target.Url)"
          Write-Host ""

          "TARGET_BUILD=$($target.Build)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "TARGET_BUILD_URL=$($target.Url)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      # ========================================================
      # 4. 比较 Build
      # ========================================================

      - name: Compare Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $current = [version]$env:CURRENT_BUILD
          $target = [version]$env:TARGET_BUILD

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Build comparison"
          Write-Host "=========================================="
          Write-Host "Current: $current"
          Write-Host "Target : $target"
          Write-Host ""

          if ($target -le $current) {
              Write-Host "No update."

              "UPDATE_AVAILABLE=false" |
                  Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

              exit 0
          }

          Write-Host ""
          Write-Host "NEW BUILD FOUND"
          Write-Host ""
          Write-Host "Old: $current"
          Write-Host "New: $target"
          Write-Host ""

          "UPDATE_AVAILABLE=true" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      # ========================================================
      # 5. UUP API 精确验证
      # ========================================================

      - name: Verify exact Build with UUP API
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Query UUP Dump API"
          Write-Host "=========================================="

          $build = $env:TARGET_BUILD

          $uri = "$env:UUP_API/fetchupd.php?arch=$env:ARCH&ring=$env:RING&flight=$env:FLIGHT&build=$build"

          Write-Host "Build:"
          Write-Host $build
          Write-Host ""
          Write-Host "UUP API:"
          Write-Host $uri
          Write-Host ""

          $response = Invoke-RestMethod `
              -Uri $uri `
              -Method Get `
              -TimeoutSec 120

          $response |
              ConvertTo-Json -Depth 50 |
              Out-File `
                  -FilePath "uup-response.json" `
                  -Encoding utf8

          Write-Host ""
          Write-Host "UUP API response:"
          $response | ConvertTo-Json -Depth 20

          $updates = $null

          if ($null -ne $response.response.updateArray) {
              $updates = @($response.response.updateArray)
          }
          elseif ($null -ne $response.response.updates) {
              $updates = @($response.response.updates)
          }
          elseif ($null -ne $response.response.updateInfo) {
              $updates = @($response.response.updateInfo)
          }

          if ($null -eq $updates -or $updates.Count -eq 0) {
              throw "UUP API returned no update information."
          }

          $matched = @()

          foreach ($item in $updates) {
              $itemBuild = $null

              foreach ($property in @(
                  "foundBuild",
                  "build",
                  "updateBuild"
              )) {
                  if ($item.PSObject.Properties.Name -contains $property) {
                      $itemBuild = [string]$item.$property
                      break
                  }
              }

              if ($itemBuild -eq $build) {
                  $matched += $item
              }
          }

          if ($matched.Count -eq 0) {
              throw @"
UUP API did not return the exact requested Build.

Requested:
$build

This workflow will NOT download another Build.
"@
          }

          $updateId = $null

          foreach ($item in $matched) {
              foreach ($property in @(
                  "updateId",
                  "uuid",
                  "id"
              )) {
                  if ($item.PSObject.Properties.Name -contains $property) {
                      $candidate = [string]$item.$property

                      if ($candidate -match '^[0-9a-fA-F-]{36}') {
                          $updateId = $candidate
                          break
                      }
                  }
              }

              if ($updateId) {
                  break
              }
          }

          if (-not $updateId) {
              throw "Exact Build was found, but Update ID was not returned."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "UUP Build verified"
          Write-Host "=========================================="
          Write-Host "Build:"
          Write-Host $build
          Write-Host ""
          Write-Host "Update ID:"
          Write-Host $updateId
          Write-Host ""

          "UUP_UPDATE_ID=$updateId" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      # ========================================================
      # 6. 准备临时目录
      # ========================================================

      - name: Prepare temporary directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "_uup_update") {
              Remove-Item `
                  -LiteralPath "_uup_update" `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path "_uup_update" |
              Out-Null


      # ========================================================
      # 7. 下载 UUP 转换包
      # ========================================================

      - name: Download UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Download UUP conversion package"
          Write-Host "=========================================="

          Write-Host "Build:"
          Write-Host $env:TARGET_BUILD
          Write-Host ""
          Write-Host "Update ID:"
          Write-Host $env:UUP_UPDATE_ID

          $packageUrl = "https://uupdump.net/get.php?id=$env:UUP_UPDATE_ID&pack=$env:LANGUAGE&edition=$env:EDITION"

          Write-Host ""
          Write-Host "Package URL:"
          Write-Host $packageUrl

          # ====================================================
          # 虚拟版本
          # ====================================================

          $virtualEditions = @(
              "ProfessionalWorkstation",
              "ProfessionalEducation",
              "Education",
              "Enterprise",
              "EnterpriseS",
              "IoTEnterprise",
              "IoTEnterpriseSubscription"
          )

          # ====================================================
          # 构造 POST 数据
          # ====================================================

          $formParts = @()

          $formParts += "autodl=3"
          $formParts += "updates=1"
          $formParts += "cleanup=1"
          $formParts += "netfx=1"
          $formParts += "esd=1"

          foreach ($edition in $virtualEditions) {
              $encoded = [System.Uri]::EscapeDataString($edition)
              $formParts += "virtualEditions%5B%5D=$encoded"
          }

          $body = $formParts -join "&"

          Write-Host ""
          Write-Host "UUP conversion options:"
          Write-Host "  Language : $env:LANGUAGE"
          Write-Host "  Edition  : $env:EDITION"
          Write-Host "  Updates  : YES"
          Write-Host "  Cleanup  : YES"
          Write-Host "  NetFx3   : YES"
          Write-Host "  Solid    : YES"
          Write-Host "  Virtual  : ALL"
          Write-Host ""

          $zipPath = Join-Path $PWD "_uup_update\uup_package.zip"

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                  Write-Host ""
                  Write-Host "Download attempt $attempt / 5"

                  Invoke-WebRequest `
                      -Uri $packageUrl `
                      -Method Post `
                      -ContentType "application/x-www-form-urlencoded" `
                      -Body $body `
                      -OutFile $zipPath `
                      -TimeoutSec 300

                  if (
                      (Test-Path -LiteralPath $zipPath) -and
                      ((Get-Item -LiteralPath $zipPath).Length -gt 1000)
                  ) {
                      $downloaded = $true
                      break
                  }
              }
              catch {
                  Write-Host ""
                  Write-Host "Download failed:"
                  Write-Host $_
              }

              if ($attempt -lt 5) {
                  Start-Sleep -Seconds 15
              }
          }

          if (-not $downloaded) {
              throw "Failed to download UUP conversion package after 5 attempts."
          }

          Write-Host ""
          Write-Host "UUP conversion package downloaded."


      # ========================================================
      # 8. 解压 UUP 包
      # ========================================================

      - name: Extract UUP conversion package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "_uup_update\uup_package.zip"
          $extract = "_uup_update\extracted"

          if (Test-Path -LiteralPath $extract) {
              Remove-Item `
                  -LiteralPath $extract `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $extract |
              Out-Null

          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

          Write-Host ""
          Write-Host "Extracted package:"

          Get-ChildItem `
              -LiteralPath $extract `
              -Recurse `
              -File |
              Select-Object FullName, Length


      # ========================================================
      # 9. 找到真正的 UUP 根目录
      # ========================================================

      - name: Normalize UUP package
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "_uup_update\extracted"

          $cmd = Get-ChildItem `
              -LiteralPath $root `
              -Recurse `
              -Filter "uup_download_windows.cmd" |
              Select-Object -First 1

          if (-not $cmd) {
              throw @"
uup_download_windows.cmd was not found.

The downloaded UUP package may be invalid.
"@
          }

          $source = $cmd.Directory.FullName

          Write-Host ""
          Write-Host "UUP package root:"
          Write-Host $source

          $required = @(
              "uup_download_windows.cmd",
              "ConvertConfig.ini"
          )

          foreach ($file in $required) {
              $path = Join-Path $source $file

              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required file missing: $file"
              }
          }

          "UUP_SOURCE=$source" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      # ========================================================
      # 10. 验证 UUP 配置
      # ========================================================

      - name: Verify UUP package configuration
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verify UUP package configuration"
          Write-Host "=========================================="
          Write-Host ""

          $config = Get-Content `
              -LiteralPath (Join-Path $source "ConvertConfig.ini") `
              -Raw

          Write-Host $config

          foreach ($check in @(
              "AddUpdates",
              "Cleanup",
              "NetFx3",
              "wim2esd",
              "StartVirtual"
          )) {
              if ($config -notmatch "(?im)^\s*$check\s*=") {
                  Write-Host "WARNING: $check not found."
              }
          }

          Write-Host ""
          Write-Host "UUP package verification completed."


      # ========================================================
      # 11. 完整替换 UUP 目录
      # ========================================================

      - name: Replace entire UUP directory
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:UUP_SOURCE
          $target = $env:FILE_NAME

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Replace entire UUP directory"
          Write-Host "=========================================="

          if (Test-Path -LiteralPath $target) {
              Write-Host "Removing old directory..."

              Remove-Item `
                  -LiteralPath $target `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $target |
              Out-Null

          Copy-Item `
              -Path (Join-Path $source "*") `
              -Destination $target `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "Directory replacement completed."

          Write-Host ""
          Write-Host "New directory:"
          Write-Host ""

          Get-ChildItem `
              -LiteralPath $target `
              -Recurse `
              -File |
              Select-Object FullName, Length


      # ========================================================
      # 12. 更新 ISO Workflow Build_VERSION
      # ========================================================

      - name: Update ISO workflow Build_VERSION
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workflow = ".github/workflows/$env:ISO_WORKFLOW"

          if (-not (Test-Path -LiteralPath $workflow)) {
              throw "ISO workflow not found: $workflow"
          }

          $content = Get-Content `
              -LiteralPath $workflow `
              -Raw

          $pattern = "(Build_VERSION\s*:\s*)['""][^'""]+['""]"
          $replacement = "`$1'$env:TARGET_BUILD'"

          $newContent = [regex]::Replace(
              $content,
              $pattern,
              $replacement
          )

          if ($newContent -eq $content) {
              throw "Build_VERSION was not changed."
          }

          Set-Content `
              -LiteralPath $workflow `
              -Value $newContent `
              -Encoding utf8

          Write-Host ""
          Write-Host "ISO workflow Build_VERSION updated:"
          Write-Host $env:TARGET_BUILD


      # ========================================================
      # 13. 保存 Build 信息
      # ========================================================

      - name: Create update information
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $info = [ordered]@{
              Channel               = "Experimental"
              Ring                  = "Dev"
              Flight                = "Mainline"
              Architecture         = "amd64"
              Language              = "zh-cn"
              Edition               = "professional"
              Build                 = $env:TARGET_BUILD
              PreviousBuild         = $env:CURRENT_BUILD
              MicrosoftReleaseNotes = $env:TARGET_BUILD_URL
              UUPUpdateID           = $env:UUP_UPDATE_ID
              UpdatedAt             = (Get-Date).ToUniversalTime().ToString("o")
          }

          $info |
              ConvertTo-Json -Depth 10 |
              Out-File `
                  -FilePath "dev-build-info.json" `
                  -Encoding utf8

          Write-Host ""
          Get-Content "dev-build-info.json"


      # ========================================================
      # 14. 检查 Git 变更
      # ========================================================

      - name: Check repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git status --short

          git add `
              "$env:FILE_NAME" `
              ".github/workflows/$env:ISO_WORKFLOW" `
              "dev-build-info.json"

          Write-Host ""
          Write-Host "Staged changes:"
          git diff --cached --stat

          if (-not (git diff --cached --quiet)) {
              Write-Host ""
              Write-Host "Changes detected."
          }
          else {
              Write-Host ""
              Write-Host "No staged changes detected."
          }


      # ========================================================
      # 15. 提交仓库
      # ========================================================

      - name: Commit repository changes
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (git diff --cached --quiet) {
              Write-Host "Nothing to commit."
              exit 0
          }

          git commit `
              -m "Update Windows 11 Experimental Build $env:TARGET_BUILD"

          git push

          if ($LASTEXITCODE -ne 0) {
              throw "git push failed."
          }

          Write-Host ""
          Write-Host "Repository updated successfully."


      # ========================================================
      # 16. 启动 ISO Workflow
      # ========================================================

      - name: Trigger ISO workflow
        if: env.UPDATE_AVAILABLE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Trigger ISO workflow"
          Write-Host "=========================================="

          gh workflow run `
              "$env:ISO_WORKFLOW" `
              --ref main

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to trigger ISO workflow."
          }

          Write-Host ""
          Write-Host "ISO workflow triggered successfully."


      # ========================================================
      # 17. 无更新
      # ========================================================

      - name: No update summary
        if: env.UPDATE_AVAILABLE == 'false'
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "NO UPDATE"
          Write-Host "=========================================="

          Write-Host "Current Build:"
          Write-Host $env:CURRENT_BUILD

          Write-Host ""

          Write-Host "Microsoft Experimental Build:"
          Write-Host $env:TARGET_BUILD

          Write-Host ""

          Write-Host "No repository changes were made."


      # ========================================================
      # 18. 完成
      # ========================================================

      - name: Completed
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Workflow finished"
          Write-Host "=========================================="
