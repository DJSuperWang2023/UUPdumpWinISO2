[convert-UUP]
AutoStart    =1
AddUpdates   =1
Cleanup      =1
ResetBase    =0
NetFx3       =1
StartVirtual =1
wim2esd      =1
wim2swm      =0
SkipISO      =0
SkipWinRE    =0
LCUwinre     =0
LCUmsuExpand =0
UpdtBootFiles=0
ForceDism    =0
RefESD       =0
SkipLCUmsu   =0
SkipEdge     =0
AutoExit     =0
DisableUpdatingUpgrade=0
AddDrivers   =0
Drv_Source   =\Drivers

[Store_Apps]
SkipApps     =0
AppsLevel    =0
StubAppsFull =0
:DOWNLOAD_APPS
echo 正在下载 Microsoft Apps 应用的 aria2 脚本...
"%aria2%" --no-conf --async-dns=false --console-log-level=warn --log-level=info --log="aria2_download.log" -o"%aria2Script%" --allow-overwrite=true --auto-file-renaming=false "https://uupdump.cn/get.php?id=a13c52d6-1b15-419a-a33e-36287bd44639&pack=neutral&edition=app&aria2=2&expires=1789344018&token=7e40398d15cf09297c631f4f2edfcc26d0bd639b1d4f98f59e8d1ba26fbac4e3"
if %ERRORLEVEL% GTR 0 call :DOWNLOAD_ERROR & exit /b 1
echo.

for /F "tokens=2 delims=:" %%i in ('findstr #UUPDUMP_ERROR: "%aria2Script%"') do set DETECTED_ERROR=%%i
if NOT [%DETECTED_ERROR%] == [] (
    echo 无法从 Windows 更新服务器检索数据。原因： %DETECTED_ERROR%
    echo 如果该问题仍然存在，很可能是您尝试下载的套件已从 Windows 更新服务器中删除。
    echo.
    pause
    goto :EOF
)

echo 正在下载 Microsoft Apps 应用...
"%aria2%" --no-conf --async-dns=false --console-log-level=warn --log-level=info --log="aria2_download.log" -x16 -s16 -j25 -c -R -d"%destDir%" -i"%aria2Script%"
if %ERRORLEVEL% GTR 0 goto :DOWNLOAD_APPS
echo.
 = "";
CustomList   =0

[create_virtual_editions]
vUseDism     =1
vAutoStart   =1
vDeleteSource=0
vPreserve    =0
vwim2esd     =1
vwim2swm     =0
vSkipISO     =0
vAutoEditions=CoreSingleLanguage,ProfessionalWorkstation,ProfessionalEducation,Education,Enterprise,ServerRdsh,IoTEnterprise,IoTEnterpriseK
